<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rec League Franchise</title>
<style>
:root {
  --field: #ffffff;
  --field-line: #c3d0bb;
  --dirt: #b56a34;
  --ink: #1c2b21;
  --ink-dim: #4c5b52;
  /* --amber is text/border on light backgrounds (headings, links, badges) — deep enough for
     AA contrast on white. --amber-bg is the ORIGINAL brighter gold, used only where amber is
     itself the background behind dark button/badge text — a deep amber there would fight the
     dark text instead of setting it off. */
  --amber: #9c5f0a;
  --amber-bg: #f2a93b;
  --red: #c02e42;
  --panel: #f7faf5;
  --panel-2: #e9f0e4;
  /* Reserved for the literal grass-colored field diagram (fielder dots) — kept dark green
     even in this bright theme so that one visualization still reads as a lawn, not a chart.
     grass-accent/grass-alert are brighter variants of amber/red tuned to stay legible against
     that dark green, since the deepened page-wide amber/red would nearly vanish on it. */
  --grass: #1f5c3d;
  --grass-ink: #f3f8f0;
  --grass-accent: #ffd166;
  --grass-alert: #ffb199;
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; background: var(--field); color: var(--ink); }
body {
  font-family: 'Courier New', ui-monospace, Menlo, monospace;
  min-height: 100vh;
}
h1, h2, h3 { font-family: 'Arial Narrow', Arial, sans-serif; letter-spacing: 0.02em; margin: 0 0 8px; }
h1 { font-size: 28px; text-transform: uppercase; color: var(--amber); }
h2 { font-size: 20px; text-transform: uppercase; color: var(--amber); }
h3 { font-size: 14px; text-transform: uppercase; color: var(--ink-dim); margin-top: 18px; }
p { line-height: 1.5; color: var(--ink-dim); }
.muted { color: var(--ink-dim); font-size: 13px; }

/* setup screen */
.setup { max-width: 720px; margin: 60px auto; padding: 24px; text-align: center; }
.sub { max-width: 480px; margin: 0 auto 24px; }
.team-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; }
.team-card {
  background: var(--panel); color: var(--ink); border: 2px solid var(--field-line);
  padding: 16px 10px; font-family: 'Arial Narrow', Arial, sans-serif; font-weight: bold;
  text-transform: uppercase; letter-spacing: 0.03em; cursor: pointer; border-radius: 4px;
}
.team-card:hover { border-color: var(--amber); color: var(--amber); }

/* nav */
.navbar {
  display:flex; justify-content: space-between; align-items:center;
  background: var(--panel-2); padding: 10px 16px; border-bottom: 3px solid var(--dirt);
  position: sticky; top:0; z-index: 10;
}
.navbrand { font-family:'Arial Narrow',Arial,sans-serif; font-weight:bold; color: var(--amber); text-transform:uppercase; letter-spacing:0.04em; }
.navlinks button {
  background: transparent; color: var(--ink); border: 1px solid var(--field-line);
  padding: 6px 10px; margin-left: 6px; border-radius: 3px; cursor: pointer; font-size: 12px;
  font-family: 'Arial Narrow', Arial, sans-serif; text-transform: uppercase;
}
.navlinks button:hover { border-color: var(--amber); color: var(--amber); }
.navlinks button.danger { border-color: var(--red); color: var(--red); }

.wrap { max-width: 720px; margin: 0 auto; padding: 16px; }

/* dashboard 3-column layout */
.dash-grid {
  max-width: 1180px; margin: 0 auto; padding: 16px;
  display: grid; grid-template-columns: 240px 1fr 280px; gap: 16px;
  grid-template-areas: "left center right";
  align-items: start;
}
.dash-col.dash-left { grid-area: left; }
.dash-col.dash-center { grid-area: center; min-width: 0; }
.dash-col.dash-right { grid-area: right; min-width: 0; align-self: stretch; display: flex; flex-direction: column; }
.dash-right .card.dash-compact { flex: 1; display: flex; flex-direction: column; margin-bottom: 0; }
.dash-right .dash-list { flex: 1; max-height: none; }
.dash-compact.card { padding: 14px; }
.dash-list { display: flex; flex-direction: column; max-height: 320px; overflow-y: auto; }
.dash-row { display: flex; align-items: center; gap: 8px; padding: 5px 4px; border-bottom: 1px dashed var(--field-line); font-size: 13px; }
.dash-row .dash-rank { color: var(--ink-dim); width: 1.4em; flex-shrink: 0; }
.dash-row .dash-team { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dash-row .dash-rec { color: var(--ink-dim); flex-shrink: 0; }
.dash-row.playoffs .dash-rank { color: var(--amber); }
.dash-row.me { background: var(--panel-2); }
.dash-row.me .dash-team { color: var(--amber); font-weight: bold; }
@media (max-width: 900px) {
  .dash-grid {
    grid-template-columns: 1fr;
    grid-template-areas: "center" "left" "right";
  }
}

/* Creation Center */
.cc-wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }
input[type="text"], input[type="number"] {
  background: var(--panel-2); color: var(--ink); border: 1px solid var(--field-line);
  padding: 6px 8px; border-radius: 4px; font-family: inherit; font-size: 13px;
}
input[type="number"] { text-align: center; }
table.cc-roster-table { width: 100%; border-collapse: collapse; font-size: 12px; }
table.cc-roster-table th, table.cc-roster-table td { padding: 4px 5px; text-align: center; border-bottom: 1px solid var(--field-line); white-space: nowrap; }
table.cc-roster-table th { color: var(--ink-dim); text-transform: uppercase; font-size: 10px; }

.card {
  background: var(--panel); border: 1px solid var(--field-line); border-radius: 6px;
  padding: 18px; margin-bottom: 16px;
}
.card.center { text-align: center; }

.scoreboard { display:flex; justify-content: space-around; background: var(--panel-2); border-radius:6px; padding: 14px; margin-bottom:16px; }
.scoreboard > div { display:flex; flex-direction:column; align-items:center; }
.scoreboard .big { font-size: 26px; font-weight:bold; color: var(--amber); font-family:'Arial Narrow',Arial,sans-serif; }
.scoreboard .label { font-size: 11px; color: var(--ink-dim); text-transform:uppercase; margin-top:4px; }

.btnrow { display:flex; gap:10px; flex-wrap:wrap; margin-top: 14px; }
.btnrow.big button { font-size:16px; padding: 16px 20px; }
button {
  background: var(--field-line); color: var(--ink); border:none; padding: 9px 14px;
  border-radius: 4px; cursor:pointer; font-family:'Arial Narrow',Arial,sans-serif;
  font-weight:bold; text-transform: uppercase; letter-spacing: 0.02em; font-size: 13px;
}
button:hover { filter: brightness(1.15); }
button.primary { background: var(--amber-bg); color: #1b1204; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
select { background: var(--panel-2); color: var(--ink); border:1px solid var(--field-line); padding:8px; border-radius:4px; font-family: inherit; }

.loglist { max-height: 260px; overflow-y: auto; }
.logline { padding: 6px 0; border-bottom: 1px dashed var(--field-line); font-size: 13px; }
.logline.muted { color: var(--ink-dim); }

.orderlist { display:flex; flex-direction:column; gap:6px; margin-top:8px; }
.prow {
  display:flex; align-items:center; gap:10px; background: var(--panel-2);
  padding: 8px 10px; border-radius: 4px; font-size: 13px; flex-wrap: wrap;
}
.pname { font-weight:bold; min-width: 140px; }
.pmeta { color: var(--ink-dim); font-size: 12px; }
.badge { font-size: 10px; padding: 2px 6px; border-radius: 3px; text-transform:uppercase; font-weight:bold; }
.badge.hurt { background: var(--red); color:#fff; }
.badge.buff { background: var(--amber-bg); color:#1b1204; }
.prow button, .prow select { margin-left: auto; }

.linescore { display:flex; justify-content:space-between; align-items:center; font-size:20px; font-weight:bold; font-family:'Arial Narrow',Arial,sans-serif; }
.inninginfo { font-size: 13px; color: var(--ink-dim); font-weight: normal; }
.diamond { position: relative; width: 120px; height: 100px; margin: 16px auto; }
.base { position:absolute; width:16px; height:16px; background: var(--panel-2); border:2px solid var(--field-line); transform: rotate(45deg); }
.base.on { background: var(--amber); border-color: var(--amber); }
.b1 { right: 0; bottom: 20px; }
.b2 { left: 50%; top: 0; margin-left:-8px; }
.b3 { left: 0; bottom: 20px; }
.matchup { text-align:center; margin: 10px 0; font-size: 14px; }
.matchup b { color: var(--amber); }

.field-box { position: relative; width: 100%; max-width: 320px; height: 230px; margin: 12px auto; background: var(--grass); border: 2px solid var(--field-line); border-radius: 10px; overflow: hidden; }
.field-dot { position: absolute; width: 14px; height: 14px; margin-left: -7px; margin-top: -7px; border-radius: 50%; background: var(--panel-2); border: 2px solid var(--field-line); }
.field-dot.ball-here { background: var(--grass-alert); border-color: var(--grass-alert); box-shadow: 0 0 6px var(--grass-alert); }
.field-label { position: absolute; font-size: 9px; color: var(--grass-ink); white-space: nowrap; transform: translate(-50%, 2px); text-align: center; }
.runner-dot { position: absolute; width: 13px; height: 13px; margin-left: -6.5px; margin-top: -6.5px; background: var(--grass-accent); border: 2px solid var(--grass-accent); transform: rotate(45deg); }
.runner-label { position: absolute; font-size: 9px; color: var(--grass-accent); font-weight: bold; white-space: nowrap; transform: translateX(-50%); }
.homeplate-dot { position: absolute; width: 11px; height: 11px; margin-left: -5.5px; margin-top: -5.5px; background: var(--dirt); border: 2px solid var(--grass-ink); transform: rotate(45deg); }
.finalscore { font-size: 30px; font-weight:bold; color: var(--amber); font-family:'Arial Narrow',Arial,sans-serif; margin: 10px 0; }

table.standings { width:100%; border-collapse: collapse; font-size: 13px; }
table.standings th, table.standings td { padding: 8px 6px; text-align:left; border-bottom: 1px solid var(--field-line); }
table.standings tr.playoffs td:first-child { color: var(--amber); }
table.standings tr.me { background: var(--panel-2); }
table.standings tr.me td:nth-child(2) { color: var(--amber); font-weight:bold; }

label { font-size: 12px; color: var(--ink-dim); display:flex; align-items:center; gap:4px; margin-left:auto; }
a { color: var(--amber); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ===== Scouting card grid ===== */
.slotstrip { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:16px; }
.slot { background:var(--panel); border:2px solid var(--field-line); border-radius:6px; padding:8px; min-height:74px; display:flex; flex-direction:column; justify-content:center; position:relative; }
.slot.filled { border-color:var(--amber); }
.slot.empty { align-items:center; justify-content:center; color:var(--ink-dim); font-size:11px; text-align:center; }
.slot .slotnum { position:absolute; top:6px; left:8px; font-size:9px; color:var(--ink-dim); font-family:'Arial Narrow',Arial,sans-serif; text-transform:uppercase; letter-spacing:.05em; }
.slot .sname { font-weight:bold; font-size:12px; margin-top:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.slot .smeta { color:var(--ink-dim); font-size:10px; margin-top:2px; }
.slot .sunassign { position:absolute; top:4px; right:4px; background:none; border:none; color:var(--ink-dim); font-size:13px; cursor:pointer; line-height:1; padding:2px 4px; }
.slot .sunassign:hover { color:var(--red); }

.scouttoolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:var(--panel-2); border:1px solid var(--field-line); border-radius:6px; padding:10px; margin-bottom:16px; }
.scouttoolbar .grp { display:flex; align-items:center; gap:6px; }
.scouttoolbar label { font-size:10px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.05em; font-family:'Arial Narrow',Arial,sans-serif; margin-left:0; }
.chipset { display:flex; gap:4px; flex-wrap:wrap; }
.chip { background:var(--field); color:var(--ink-dim); border:1px solid var(--field-line); padding:5px 10px; border-radius:20px; font-size:11px; cursor:pointer; font-family:'Arial Narrow',Arial,sans-serif; text-transform:uppercase; letter-spacing:.03em; }
.chip.active { background:var(--amber-bg); color:#1b1204; border-color:var(--amber-bg); font-weight:bold; }
.favtogglebtn { background:var(--field); border:1px solid var(--field-line); color:var(--ink-dim); padding:5px 10px; border-radius:20px; font-size:12px; cursor:pointer; margin-left:auto; }
.favtogglebtn.active { color:var(--amber); border-color:var(--amber); }
.scoutcount { color:var(--ink-dim); font-size:11px; }

.gridscroll { max-height:640px; overflow-y:auto; padding-right:2px; margin-bottom:4px; }
.pgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(148px,1fr)); gap:10px; }
.pcard { aspect-ratio:1/1; background:var(--panel); border:1px solid var(--field-line); border-radius:8px; padding:9px; display:flex; flex-direction:column; cursor:pointer; position:relative; }
.pcard:hover { border-color:var(--dirt); }
.pcard.assigned { border-color:var(--amber); }
.pcard .toprow { display:flex; justify-content:space-between; align-items:flex-start; }
.pcard .rank { font-family:'Arial Narrow',Arial,sans-serif; font-weight:bold; color:var(--amber); font-size:12px; }
.pcard .starbtn { background:none; border:none; color:var(--field-line); font-size:18px; cursor:pointer; line-height:1; padding:4px; margin:-4px -4px 0 0; border-radius:4px; }
.pcard .starbtn:hover { color:var(--amber); background:var(--panel-2); }
.pcard .starbtn.active { color:var(--amber); }
.pcard .pname { font-weight:bold; font-size:12.5px; margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink); }
.pcard .pmeta2 { color:var(--ink-dim); font-size:10px; margin-top:1px; }
.pcard .scoutbar { background:var(--panel-2); border-radius:3px; height:5px; overflow:hidden; margin-top:6px; }
.pcard .scoutfill { height:100%; background:var(--dirt); }
.pcard .scoutlabel { color:var(--ink-dim); font-size:9px; margin-top:2px; }
.pcard .grades { margin-top:auto; padding-top:6px; border-top:1px dashed var(--field-line); }
.pcard .gline { display:flex; justify-content:space-between; font-size:10.5px; line-height:1.55; }
.pcard .gline .glabel { color:var(--ink-dim); font-family:'Arial Narrow',Arial,sans-serif; letter-spacing:.03em; }
.pcard .gline .gval { color:var(--ink); font-variant-numeric:tabular-nums; }
.pcard .assignedtag { position:absolute; bottom:6px; right:6px; background:var(--amber-bg); color:#1b1204; font-size:8px; font-weight:bold; padding:1px 5px; border-radius:3px; text-transform:uppercase; max-width:calc(100% - 12px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pcard.taken { opacity:.5; }
.pcard .assignedtag.takentag { background:var(--field-line); color:var(--ink); }

.pbackdrop { position:fixed; inset:0; background:rgba(0,0,0,.55); opacity:0; pointer-events:none; transition:opacity .18s; z-index:5; }
.pbackdrop.open { opacity:1; pointer-events:auto; }
.pdrawer { position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--panel); border-top:2px solid var(--amber); border-radius:12px 12px 0 0; padding:16px; max-height:78vh; overflow-y:auto; transform:translateY(105%); transition:transform .2s ease-out; box-shadow:0 -8px 30px rgba(0,0,0,.4); }
.pdrawer.open { transform:translateY(0); }
.pdrawer .dhead { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.pdrawer h2 { font-size:18px; color:var(--ink); text-transform:none; }
.pdrawer .dmeta { color:var(--ink-dim); font-size:12px; margin-top:2px; }
.pdrawer .dclose { background:none; border:1px solid var(--field-line); color:var(--ink-dim); border-radius:4px; padding:4px 10px; cursor:pointer; font-size:12px; }
.dassign { margin:14px 0; background:var(--panel-2); border:1px solid var(--field-line); border-radius:6px; padding:10px 12px; }
.dassign .section-label { margin-bottom:8px; font-family:'Arial Narrow',Arial,sans-serif; text-transform:uppercase; font-size:12px; color:var(--ink-dim); letter-spacing:.06em; }
.slotrow { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px dashed var(--field-line); }
.slotrow:last-child { border-bottom:none; }
.slotrow .slabel { font-size:12.5px; }
.slotrow .slabel b { color:var(--ink-dim); font-weight:normal; font-family:'Arial Narrow',Arial,sans-serif; text-transform:uppercase; font-size:10px; letter-spacing:.05em; margin-right:6px; }
.slotrow .slabel .occname { color:var(--ink-dim); }
.pslotbtn { background:var(--amber-bg); color:#1b1204; border:none; border-radius:4px; padding:6px 14px; font-size:11.5px; cursor:pointer; font-family:'Arial Narrow',Arial,sans-serif; font-weight:bold; text-transform:uppercase; letter-spacing:.03em; white-space:nowrap; }
.pslotbtn:hover { background:#f5bb5f; }
.pslotbtn.here { background:none; border:1px solid var(--amber); color:var(--amber); cursor:default; }
.pslotbtn.replace { background:var(--field); color:var(--ink); border:1px solid var(--field-line); }
.pslotbtn.replace:hover { border-color:var(--amber); color:var(--amber); background:var(--panel-2); }
.dranges { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:6px 16px; margin:14px 0; }
.drange { display:flex; justify-content:space-between; font-size:12px; border-bottom:1px dashed var(--field-line); padding-bottom:3px; }
.drange .dlabel { color:var(--ink-dim); }
.drange .dval { font-variant-numeric:tabular-nums; color:var(--ink); }
.scoutsectionlabel { font-family:'Arial Narrow',Arial,sans-serif; text-transform:uppercase; font-size:12px; color:var(--ink-dim); letter-spacing:.06em; margin:0 0 8px; }

/* ===== Month-grid calendar ===== */
.cal-month { margin-bottom: 22px; border: 1px solid var(--field-line); border-radius: 6px; overflow: hidden; }
.cal-monthhead { background: var(--panel-2); color: var(--amber); font-family:'Arial Narrow',Arial,sans-serif; text-transform: uppercase; letter-spacing: 0.04em; font-weight: bold; font-size: 15px; text-align: center; padding: 8px; border-bottom: 2px solid var(--dirt); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.cal-dow { background: var(--panel-2); color: var(--ink-dim); font-family:'Arial Narrow',Arial,sans-serif; text-transform: uppercase; font-size: 10px; letter-spacing: 0.04em; text-align: center; padding: 5px 2px; border-bottom: 1px solid var(--field-line); }
.cal-cell { min-height: 78px; background: var(--field); border-right: 1px solid var(--field-line); border-bottom: 1px solid var(--field-line); padding: 3px 4px; position: relative; overflow: hidden; }
.cal-grid .cal-cell:nth-child(7n) { border-right: none; }
.cal-cell.cal-empty { background: var(--panel); }
.cal-cell.cal-current { background: var(--panel-2); box-shadow: inset 0 0 0 2px var(--amber); }
.cal-daynum { font-size: 10px; color: var(--ink-dim); text-align: right; font-variant-numeric: tabular-nums; }
.cal-events { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; }
.cal-event { font-size: 9px; line-height: 1.3; padding: 2px 3px; border-radius: 3px; background: var(--panel-2); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-event.cal-practice { color: var(--ink-dim); border-left: 2px solid var(--dirt); }
.cal-event.cal-game { border-left: 2px solid var(--amber); }
.cal-event.cal-win { background: var(--amber-bg); color: #1b1204; font-weight: bold; }
.cal-event.cal-loss { border-left-color: var(--red); }

/* ===== Playoff bracket ===== */
.bracket-scroll { overflow-x: auto; padding-bottom: 4px; }
.bracket { display: flex; gap: 28px; min-width: 640px; padding: 4px 2px; }
.bracket-round { display: flex; flex-direction: column; flex: 1; }
.bracket-round > .bracket-matchup { margin-bottom: 14px; }
.bracket-round-sf { justify-content: space-around; }
.bracket-round-champ { justify-content: center; }
.bracket-roundlabel { font-family:'Arial Narrow',Arial,sans-serif; text-transform: uppercase; font-size: 11px; color: var(--ink-dim); letter-spacing: 0.05em; margin-bottom: 8px; }
.bracket-matchup { background: var(--panel); border: 1px solid var(--field-line); border-radius: 6px; overflow: hidden; position: relative; }
.bracket-matchup.bracket-final { border-color: var(--amber); border-width: 2px; }
.bracket-team { padding: 7px 10px; font-size: 12px; color: var(--ink-dim); border-bottom: 1px dashed var(--field-line); white-space: nowrap; }
.bracket-team:last-of-type { border-bottom: none; }
.bracket-team.bracket-winner { color: var(--ink); font-weight: bold; background: var(--panel-2); }
.bracket-team.bracket-tbd { color: var(--field-line); font-style: italic; }
.bracket-score { position: absolute; right: -2px; top: 50%; transform: translate(100%, -50%); font-size: 10px; color: var(--ink-dim); white-space: nowrap; padding-left: 8px; }

</style>
</head>
<body>
<div id="app"></div>

    const center = clamp(trueVal + noise, 1, 99);

function generateSchedule(teams) {
  const n = teams.length;
  const arr = teams.slice();
  const fixed = arr[0];
  let rotating = arr.slice(1);
  const gameSlates = [];
  for (let r = 0; r < n - 1; r++) {
    const slateTeams = [fixed, ...rotating];
    const pairs = [];
    for (let i = 0; i < n / 2; i++) {
      const home = slateTeams[i];
      const away = slateTeams[n - 1 - i];
      pairs.push(r % 2 === 0 ? [home, away] : [away, home]);
    }
    gameSlates.push(pairs);
    rotating.unshift(rotating.pop());
  }
  return gameSlates;
}
function buildSchedule() {
  const firstCycle = generateSchedule(TEAM_NAMES); // 9 game days
  const extra = firstCycle.slice(0, 6).map(slate => slate.map(([h,a]) => [a,h]));
  const allSlates = [...firstCycle, ...extra]; // 15 game days
  const weeks = [];
  for (let i = 0; i < allSlates.length; i += 2) weeks.push(allSlates.slice(i, i+2));
  return { schedule: allSlates, weeks };
}

function addDays(dateStr, days) {
  const d = new Date(dateStr + 'T00:00:00');

}

}
// ~2 games/week cadence, alternating 3/4-day gaps between games (no fixed real-world weekday assumed)
// The league runs on a fixed real-world-plausible calendar, not "whenever the app happens to be
// opened": season starts April 1, Fall Ball follows in August right after the season/playoffs
// wrap, and the draft happens the following March, just before the next April kickoff.
function seasonStartDate(baseYear, seasonNumber) {
  const year = baseYear + (seasonNumber - 1);
  return `${year}-04-01`;
}
function assignGameDates(numGames, baseYear, seasonNumber) {
  const dates = [];
  const gaps = [3, 4];
  let cur = seasonStartDate(baseYear, seasonNumber);
  for (let i = 0; i < numGames; i++) {
    dates.push(cur);
    cur = addDays(cur, gaps[i % 2]);
  }
  return dates;
}
function fallBallDates(baseYear, seasonNumber) {
  const year = baseYear + (seasonNumber - 1);
  const gaps = [3, 4, 3, 4];
  let cur = `${year}-08-01`;
  const dates = [cur];
  gaps.forEach(g => { cur = addDays(cur, g); dates.push(cur); });
  return dates;
}

  const year = baseYear + seasonNumber; // March of the year the NEXT season's April will begin
  return `${year}-03-15`;

  // byBat is already sorted best-to-worst from local playerObjs data (STATE doesn't exist yet
  // during initial franchise construction, so this can't go through the STATE-based helper).
  const orderedStarters = heartOfOrderFromRanked(byBat.map(p => p.Name).filter(n => starters.includes(n)));
  const bench = playerObjs.map(p=>p.Name).filter(n => !starters.includes(n));

  return { starters: orderedStarters, bench };
}
function buildDefaultRoster(teamName, sourceRoster) {
  const players = (sourceRoster || ROSTER_DATA).filter(p => p.Team === teamName);
  const struct = selectRosterStructure(players);
  return { ...struct, record: { w:0, l:0 }, runsFor: 0, runsAgainst: 0 };
}

// customSet: an optional {teamNames, roster} pair from the Creation Center (see
// isCustomRosterSetValid()) -- when given, the franchise is built from it instead of the real
// ROSTER_DATA/DEFAULT_TEAM_NAMES. TEAM_NAMES is reassigned here, before anything below reads it,
// so every downstream system (schedule gen, draft AI, trades, standings, ...) sees the right teams.
function newFranchise(userTeam, tradesEnabled, customSet) {
  const sourceRoster = customSet ? customSet.roster : ROSTER_DATA;
  TEAM_NAMES = customSet ? customSet.teamNames.slice() : DEFAULT_TEAM_NAMES.slice();
  const leagueBaseYear = new Date().getFullYear();
  const { schedule, weeks } = buildSchedule();
  const gameDates = assignGameDates(schedule.length, leagueBaseYear, 1);
  const players = {};
  sourceRoster.forEach(p => {
    const isCatcher = p.Positions.includes('C');
    players[p.Name] = {
      ...p,
      Positions: p.Positions.slice(), // independent copy -- sourceRoster may be reused by other franchises
      injuredGames: 0,
      restUntilDate: null,
      practiceBuff: { cat: null, amt: 0, gamesLeft: 0 },
      confidenceBat: 50,
      confidencePitch: 50,
      pitchCountToday: 0,
      hitStreak: 0, scorelessInningsStreak: 0, _gameHadHit: false, _gameHadAB: false,
      // Fielding/baserunning: flat placeholder ratings (player_ratings_v5) — no real scouted data yet.
      Glove: 70, ArmStrength: 70, Accuracy: 70, Speed: 70,
      ...(isCatcher ? { Blocking: 70, Framing: 70 } : {}),
      stats: { pa:0, ab:0, h:0, '2b':0, '3b':0, hr:0, bb:0, k:0, rbi:0, sb:0, cs:0, outs:0, er:0, kP:0, bbP:0, hAllowed:0 },
      seasonHistory: {},
    };
  });
  const teams = {};
  TEAM_NAMES.forEach(t => { teams[t] = buildDefaultRoster(t, sourceRoster); });

  return {
    version: 1,
    userTeam,
    teamNames: TEAM_NAMES.slice(), // persisted so loadState() can restore TEAM_NAMES for THIS franchise
    leagueBaseYear,
    players,
    teams,
    schedule, weeks,
    gameDates,
    gameResults: [],
    gamePointer: 0,
    phase: 'practice', // 'practice' | 'game' | 'gameResolved'
    screen: 'dashboard',
    log: [],
    leagueNews: [],
    practiceChoiceThisGame: null,
    seasonOver: false,
    playoffs: null,
    seasonNumber: 1,
    prospectPool: generateProspectPool(sourceRoster.map(p => p.Name)),
    scoutingSlots: [null, null, null, null, null],
    favoriteProspectIds: [],
    autoScouting: false,
    offseason: null,
    tradesEnabled: !!tradesEnabled,
    pendingTradeOffers: [],
    tradeHistory: [],
  };
}

/* ===================== SEASON ROLLOVER / OFFSEASON ===================== */
function performSeasonRollover() {
  const year = STATE.seasonNumber;
  const picksNeeded = {};
  TEAM_NAMES.forEach(teamName => {
    const t = STATE.teams[teamName];
    const roster = [...t.starters, ...t.bench];
    let graduates = 0;
    roster.forEach(name => {
      const p = STATE.players[name];
      p.seasonHistory[year] = { ...p.stats, Age: p.Age, Team: teamName };
      if (p.Age >= 12) {
        graduates++;
        t.starters = t.starters.filter(n => n !== name);
        t.bench = t.bench.filter(n => n !== name);
      } else {
        p.Age += 1;
        applyDevelopmentBoost(p);
      }
      p.stats = { pa:0, ab:0, h:0, '2b':0, '3b':0, hr:0, bb:0, k:0, rbi:0, sb:0, cs:0, outs:0, er:0, kP:0, bbP:0, hAllowed:0 };
      p.injuredGames = 0;
      p.restUntilDate = null;
      p.practiceBuff = { cat: null, amt: 0, gamesLeft: 0 };
      p.confidenceBat = 50;
      p.confidencePitch = 50;
      p.pitchCountToday = 0;
      p.hitStreak = 0; p.scorelessInningsStreak = 0; p._gameHadHit = false; p._gameHadAB = false;
    });
    picksNeeded[teamName] = graduates;
    t.record = { w:0, l:0 };
    t.runsFor = 0; t.runsAgainst = 0;
  });
  STATE.seasonNumber++;
  return picksNeeded;
}
// Heart-of-the-order heuristic (confirmed 2026-08-16): ranks a 9-man lineup by BatOVR and slots
// the best bats into the 3-4-5 spots instead of leaving batting order as whatever incidental
// order roster construction/trades/drafts happened to leave it in. battingSlot -> BatOVR-rank
// index (0 = best hitter): 1st=3rd-best, 2nd=5th-best, 3rd=best, 4th=2nd-best, 5th=4th-best,
// 6th-9th=remaining in descending order.
const HEART_OF_ORDER_RANKS = [2, 4, 0, 1, 3, 5, 6, 7, 8];
// Takes a list already sorted BEST-BatOVR-FIRST and slots it into batting order -- kept separate
// from the STATE-based lookup below since this also runs during initial roster construction,
// before STATE exists yet, off the local playerObjs array instead.
function heartOfOrderFromRanked(rankedNamesDesc) {
  if (rankedNamesDesc.length !== 9) return rankedNamesDesc.slice();
  return HEART_OF_ORDER_RANKS.map(rank => rankedNamesDesc[rank]);
}
function heartOfOrderBattingOrder(names) {
  const byOVR = names.slice().sort((a,b) => STATE.players[b].BatOVR - STATE.players[a].BatOVR);
  return heartOfOrderFromRanked(byOVR);
}
// Re-derives a CPU team's batting order any time its roster changes (draft, trade, aging-out
// refill) so the lineup never goes stale -- membership is untouched, only the order. The user's
// own team is left alone here; they get to choose their own order on the Lineup screen.
function optimizeCPUTeamLineup(teamName) {
  if (teamName === STATE.userTeam) return;
  const t = STATE.teams[teamName];
  t.starters = heartOfOrderBattingOrder(t.starters);
}
function refillRosterAfterOffseason(teamName) {
  const t = STATE.teams[teamName];
  while (t.starters.length < 9 && t.bench.length) {
    t.bench.sort((a,b) => STATE.players[b].BatOVR - STATE.players[a].BatOVR);
    t.starters.push(t.bench.shift());
  }
  optimizeCPUTeamLineup(teamName);
}

/* ===================== TRADES (opt-in, set at franchise creation) =====================
   Window: open during the regular season only -- closed the moment playoffs start, and stays
   closed through the whole offseason (Fall Ball + Draft), reopening automatically once
   startNewSeason() resets phase/playoffs/offseason for the new year. */
function tradeWindowOpen() {
  return !!(STATE.tradesEnabled && !STATE.playoffs && !STATE.offseason && (STATE.phase === 'practice' || STATE.phase === 'game'));
}

/* ---- Trade Value formula (confirmed with user 2026-08-16) ----
   1. Base = MaxOVR (better of BatOVR/PitOVR), plus a two-way bonus: if the OTHER of the two is
      >=45 (a real, usable second skill -- well above the 30 non-pitcher floor), add
      (secondaryOVR-45)*0.15. A pure one-way player gets no bonus.
   2. Age multiplier: 9=x1.4, 10=x1.2, 11=x1.0, 12=x0.5 (a 12-year-old is a rental -- gone after
      this season).
   3. Team-context weight, from the EVALUATING team's own perspective (their own gives AND gets
      both use their own context -- the same player can be worth different amounts to different
      teams): contenders (win% >=.600, min 5 games played) dampen the age multiplier 65% of the
      way toward 1.0 and take current OVR at full value; rebuilders (win% <=.400) keep the age
      multiplier at full strength and discount current OVR by 15%; everyone else (including <5
      games played) uses the untouched base numbers.
   4. Position need: reuses the same 4-category system (C/1B/INF/OF) teamPositionCounts() already
      uses for the draft AI, but a rostered age-12 player only counts as half a body (they're
      leaving after this season, not real long-term coverage). Effective coverage <=1 -> x1.25,
      <=2 -> x1.10, >=3 -> x1.0 (no penalty for being deep, only a bonus for being thin). */
const TWO_WAY_THRESHOLD = 45;
const TWO_WAY_BONUS_RATE = 0.15;
const AGE_VALUE_MULT = { 9: 1.15, 10: 1.08, 11: 1.00, 12: 0.85 };
const CONTENDER_WIN_PCT = 0.60;
const REBUILDER_WIN_PCT = 0.40;
const CONTEXT_MIN_GAMES = 5;
const CONTENDER_AGE_DAMPEN = 0.35; // fraction of (ageMult-1) that survives for a contender
const REBUILDER_OVR_DISCOUNT = 0.85;
const POSITION_NEED_MULT = { high: 1.25, moderate: 1.10, none: 1.0 };

function baseTradeValue(name) {
  const p = STATE.players[name];
  const maxOVR = Math.max(p.BatOVR, p.PitOVR);
  const secondaryOVR = Math.min(p.BatOVR, p.PitOVR);
  const twoWayBonus = secondaryOVR >= TWO_WAY_THRESHOLD ? (secondaryOVR - TWO_WAY_THRESHOLD) * TWO_WAY_BONUS_RATE : 0;
  return maxOVR + twoWayBonus;
}
function teamContext(teamName) {
  const t = STATE.teams[teamName];
  const g = t.record.w + t.record.l;
  if (g < CONTEXT_MIN_GAMES) return 'neutral';
  const pct = t.record.w / g;
  if (pct >= CONTENDER_WIN_PCT) return 'contender';
  if (pct <= REBUILDER_WIN_PCT) return 'rebuilder';
  return 'neutral';
}
function effectivePositionCoverage(teamName, pos) {
  const t = STATE.teams[teamName];
  let count = 0;
  [...t.starters, ...t.bench].forEach(n => {
    const pl = STATE.players[n];
    if (pl.Positions[0] === pos) count += (pl.Age === 12 ? 0.5 : 1);
  });
  return count;
}
function positionNeedMultiplier(teamName, name) {
  const pos = STATE.players[name].Positions[0];
  const coverage = effectivePositionCoverage(teamName, pos);
  if (coverage <= 1) return POSITION_NEED_MULT.high;
  if (coverage <= 2) return POSITION_NEED_MULT.moderate;
  return POSITION_NEED_MULT.none;
}
// Trade value of `name` as seen by `teamName` -- used both for players teamName would give away
// (their own surplus is worth less to THEM) and players they'd receive (need is worth more to
// THEM), so this same function drives both sides of any evaluation.
function tradeValueFor(teamName, name) {
  const p = STATE.players[name];
  const ageMult = AGE_VALUE_MULT[p.Age] ?? 1.0;
  const context = teamContext(teamName);
  let effectiveAgeMult = ageMult, ovrMult = 1.0;
  if (context === 'contender') { effectiveAgeMult = 1 + (ageMult - 1) * CONTENDER_AGE_DAMPEN; }
  else if (context === 'rebuilder') { ovrMult = REBUILDER_OVR_DISCOUNT; }
  return baseTradeValue(name) * ovrMult * effectiveAgeMult * positionNeedMultiplier(teamName, name);
}

/* ---- Evaluation: accept / counter / reject ---- */
const TRADE_ACCEPT_THRESHOLD = 0.90;
const TRADE_TOLERANCE_RANGE = 0.05; // +/- per-evaluation wobble so it isn't robotic-exact
const TRADE_COUNTER_FLOOR = 0.75; // below this, gap's too big to bridge with one adjustment
// teamName evaluates giving away givingNames in exchange for receivingNames, using its own context.
function evaluateTradeFor(teamName, givingNames, receivingNames) {
  const giveValue = givingNames.reduce((s,n) => s + tradeValueFor(teamName,n), 0);
  const getValue = receivingNames.reduce((s,n) => s + tradeValueFor(teamName,n), 0);
  const threshold = TRADE_ACCEPT_THRESHOLD + (rand()*2-1) * TRADE_TOLERANCE_RANGE;
  const ratio = giveValue > 0 ? getValue / giveValue : (getValue > 0 ? Infinity : 1);
  const verdict = ratio >= threshold ? 'accept' : ratio >= TRADE_COUNTER_FLOOR ? 'counter' : 'reject';
  return { verdict, ratio, giveValue, getValue };
}
// Builds a minimal one-piece SWAP (never an add or a drop -- the trade's core rule is that both
// sides keep the same headcount, so a counter can only replace one piece with another, never
// change how many players are on either side) that pushes a 'counter' verdict up to fair. Returns
// null if no single swap gets there (caller should fall back to reject).
function constructCounterOffer(teamName, otherTeam, givingNames, receivingNames) {
  const giveValue = givingNames.reduce((s,n) => s + tradeValueFor(teamName,n), 0);
  const getValue = receivingNames.reduce((s,n) => s + tradeValueFor(teamName,n), 0);

  // Option A: upgrade -- swap the cheapest-to-teamName piece already in receivingNames for a
  // pricier one still available on otherTeam's roster (asking for someone better instead, not
  // someone extra).
  const otherRoster = [...STATE.teams[otherTeam].starters, ...STATE.teams[otherTeam].bench].filter(n => !receivingNames.includes(n));
  let upgradeOption = null;
  if (receivingNames.length && otherRoster.length) {
    const cheapestReceiving = receivingNames.map(n => ({ n, v: tradeValueFor(teamName,n) })).sort((a,b) => a.v - b.v)[0];
    const candidates = otherRoster.map(n => ({ n, v: tradeValueFor(teamName, n) })).filter(c => c.v > cheapestReceiving.v).sort((a,b) => a.v - b.v);
    const hit = candidates.find(c => (getValue - cheapestReceiving.v + c.v) / giveValue >= TRADE_ACCEPT_THRESHOLD);
    if (hit) upgradeOption = { remove: cheapestReceiving.n, add: hit.n, cost: hit.v - cheapestReceiving.v };
  }

  // Option B: downgrade -- swap the priciest-to-teamName piece already in givingNames for a
  // cheaper one from teamName's own remaining roster (giving up someone less valuable instead of
  // giving up fewer players).
  const ownRoster = [...STATE.teams[teamName].starters, ...STATE.teams[teamName].bench].filter(n => !givingNames.includes(n));
  let downgradeOption = null;
  if (givingNames.length && ownRoster.length) {
    const priciestGiving = givingNames.map(n => ({ n, v: tradeValueFor(teamName,n) })).sort((a,b) => b.v - a.v)[0];
    const candidates = ownRoster.map(n => ({ n, v: tradeValueFor(teamName, n) })).filter(c => c.v < priciestGiving.v).sort((a,b) => b.v - a.v);
    const hit = candidates.find(c => (giveValue - priciestGiving.v + c.v) > 0 && getValue / (giveValue - priciestGiving.v + c.v) >= TRADE_ACCEPT_THRESHOLD);
    if (hit) downgradeOption = { remove: priciestGiving.n, add: hit.n, savings: priciestGiving.v - hit.v };
  }

  if (upgradeOption && downgradeOption) {
    return upgradeOption.cost <= downgradeOption.savings
      ? { type: 'upgrade', givingNames, receivingNames: receivingNames.map(n => n === upgradeOption.remove ? upgradeOption.add : n) }
      : { type: 'downgrade', givingNames: givingNames.map(n => n === downgradeOption.remove ? downgradeOption.add : n), receivingNames };
  }
  if (upgradeOption) return { type: 'upgrade', givingNames, receivingNames: receivingNames.map(n => n === upgradeOption.remove ? upgradeOption.add : n) };
  if (downgradeOption) return { type: 'downgrade', givingNames: givingNames.map(n => n === downgradeOption.remove ? downgradeOption.add : n), receivingNames };
  return null;
}

// Any pending offer to the user that names one of the just-moved players (on either side) is now
// stale -- that player isn't where the offer assumed anymore. Executing a stale offer would push
// a name onto a roster it's already left (or already sitting on), duplicating it across two teams
// at once. Drop those offers here, right as the players move, so the inbox never shows a deal that
// can no longer actually happen.
function invalidateStaleTradeOffers(movedNames) {
  const moved = new Set(movedNames);
  const stale = STATE.pendingTradeOffers.filter(o => o.theyGive.some(n => moved.has(n)) || o.theyGet.some(n => moved.has(n)));
  if (!stale.length) return;
  STATE.pendingTradeOffers = STATE.pendingTradeOffers.filter(o => !stale.includes(o));
  stale.forEach(o => STATE.log.unshift(`[Trade] ${o.fromTeam}'s offer is no longer available -- one of the players involved was traded elsewhere.`));
}
function executeTrade(teamA, aGives, teamB, bGives) {
  aGives.forEach(n => {
    STATE.teams[teamA].starters = STATE.teams[teamA].starters.filter(x => x !== n);
    STATE.teams[teamA].bench = STATE.teams[teamA].bench.filter(x => x !== n);
    STATE.teams[teamB].bench.push(n);
    STATE.players[n].Team = teamB;
  });
  bGives.forEach(n => {
    STATE.teams[teamB].starters = STATE.teams[teamB].starters.filter(x => x !== n);
    STATE.teams[teamB].bench = STATE.teams[teamB].bench.filter(x => x !== n);
    STATE.teams[teamA].bench.push(n);
    STATE.players[n].Team = teamA;
  });
  refillRosterAfterOffseason(teamA);
  refillRosterAfterOffseason(teamB);
  STATE.tradeHistory.unshift({
    round: STATE.gamePointer, date: currentGameDate(), status: 'completed',
    teamA, teamAGives: aGives, teamB, teamBGives: bGives,
  });
  pushLeagueNewsHeadline(`Trade: ${teamA} send ${aGives.join(', ')} to ${teamB} for ${bGives.join(', ')}.`);
  invalidateStaleTradeOffers([...aGives, ...bGives]);
}
// Records a non-completed resolution (declined, or countered with the counter-terms attached) so
// Trade History shows what was proposed and how it was resolved, not just trades that went through.
function recordTradeOutcome(status, teamA, teamAGives, teamB, teamBGives, counterTeamAGives, counterTeamBGives) {
  STATE.tradeHistory.unshift({
    round: STATE.gamePointer, date: currentGameDate(), status,
    teamA, teamAGives, teamB, teamBGives,
    ...(counterTeamAGives ? { counterTeamAGives, counterTeamBGives } : {}),
  });
}

/* ---- CPU-initiated trades: weekly cadence, hooked in from finishGameAndAdvance() ---- */
const CPU_TRADE_EVAL_CHANCE = 0.12; // per CPU team, per week (confirmed with user 2026-08-16)
// Finds the single best opportunity for shopperTeam: the highest-value-to-them target anywhere
// in the league, paired with the cheapest-to-them giveaway that the owning team would already
// accept outright -- so a CPU-initiated offer is always already fair-to-good, never a lowball.
function findCpuInitiatedOffer(shopperTeam) {
  const shopperRoster = [...STATE.teams[shopperTeam].starters, ...STATE.teams[shopperTeam].bench];
  const otherTeams = TEAM_NAMES.filter(t => t !== shopperTeam);
  const candidates = [];
  otherTeams.forEach(owningTeam => {
    [...STATE.teams[owningTeam].starters, ...STATE.teams[owningTeam].bench].forEach(name => {
      candidates.push({ owningTeam, name, valueToShopper: tradeValueFor(shopperTeam, name) });
    });
  });
  candidates.sort((a,b) => b.valueToShopper - a.valueToShopper);
  // Deliberately bounded search (calibrated against a 25-season simulation to land at ~4 trade
  // events/season, the middle of the "2-5 completed trades per season" pacing target): the
  // shopper's 9 most-coveted players league-wide, tried against their 9 cheapest-to-them
  // giveaways. An unbounded search (every target x every giveaway) finds *some* accepting
  // combination almost every time, which measured out to ~8.6 events/season -- well past the
  // intended pacing -- so this keeps it closer to "the stars have to actually line up."
  const topTargets = candidates.slice(0, 9);
  const giveaways = shopperRoster.map(n => ({ name: n, v: tradeValueFor(shopperTeam, n) })).sort((a,b) => a.v - b.v).slice(0, 9);

  for (const target of topTargets) {
    for (const give of giveaways) {
      const evalResult = evaluateTradeFor(target.owningTeam, [target.name], [give.name]);
      if (evalResult.verdict !== 'accept') continue;
      const shopperRatio = tradeValueFor(shopperTeam, target.name) / (tradeValueFor(shopperTeam, give.name) || 1);
      if (shopperRatio >= 1.0) {
        return { shopperTeam, owningTeam: target.owningTeam, shopperGives: [give.name], shopperGets: [target.name] };
      }
    }
  }
  return null;
}
function genTradeOfferId() { return 'to_' + Math.random().toString(36).slice(2, 10); }
function runCpuTradeEvaluations() {
  if (!STATE.tradesEnabled || STATE.playoffs || STATE.offseason) return;
  TEAM_NAMES.filter(t => t !== STATE.userTeam).forEach(shopperTeam => {
    if (rand() >= CPU_TRADE_EVAL_CHANCE) return;
    const offer = findCpuInitiatedOffer(shopperTeam);
    if (!offer) return;
    if (offer.owningTeam === STATE.userTeam) {
      STATE.pendingTradeOffers.push({
        id: genTradeOfferId(), fromTeam: offer.shopperTeam,
        theyGive: offer.shopperGives, theyGet: offer.shopperGets,
      });
      STATE.log.unshift(`[Trade] ${offer.shopperTeam} has sent you a trade offer.`);
    } else {
      executeTrade(offer.shopperTeam, offer.shopperGives, offer.owningTeam, offer.shopperGets);
      STATE.log.unshift(`[Trade] ${offer.shopperTeam} and ${offer.owningTeam} agreed to a deal: ${offer.shopperGives.join(', ')} for ${offer.shopperGets.join(', ')}.`);
    }
  });
}

/* ---- User-facing screens: propose a trade, respond to incoming offers, trade history ---- */
function renderTrade() {
  const userTeam = STATE.userTeam;
  const pending = STATE.pendingTradeOffers || [];
  if (!tradeWindowOpen()) {
    APP().innerHTML = `${navBar()}
      <div class="wrap"><div class="card">

  const theirRoster = [...STATE.teams[draft.withTeam].starters, ...STATE.teams[draft.withTeam].bench];

  draft.offer = draft.offer.filter(n => myRoster.includes(n));
  draft.request = draft.request.filter(n => theirRoster.includes(n));
  const countsMatch = draft.offer.length === draft.request.length && draft.offer.length > 0;

  function rosterRows(names, selected, toggleFn) {
    return names.map(n => {
      const p = STATE.players[n];
      const checked = selected.includes(n);
      return `<div class="prow">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;flex:1;">

  }
  function offerRow(o) {

    </div>`;
  }

  const msg = STATE._tradeResultMessage;
  const msgColor = msg && msg.type === 'declined' ? 'var(--red)' : 'var(--amber)';
  APP().innerHTML = `${navBar()}
    <div class="wrap">
      ${msg ? `<div class="card" style="border-left:4px solid ${msgColor};"><p style="margin:0;color:${msgColor};font-weight:bold;">${msg.text}</p></div>` : ''}
      ${pending.length ? `<div class="card">
        <h2>Trade Offers (${pending.length})</h2>
        <div class="orderlist">${pending.map(offerRow).join('')}</div>
      </div>` : ''}
      <div class="card">
        <h2>Propose a Trade</h2>
        <p>Trade with:</p>
        <select onchange="setTradePartner(this.value)">

  const requestDesc = draft.request.join(', ');

  const result = evaluateTradeFor(partner, draft.request, draft.offer);
  if (result.verdict === 'accept') {
    executeTrade(userTeam, draft.offer, partner, draft.request);
    STATE.log.unshift(`[Trade] Deal with ${partner}: you send ${offerDesc} for ${requestDesc}.`);
    STATE._tradeResultMessage = { type: 'accepted', text: `${partner} accepted your trade!` };

      STATE.log.unshift(`[Trade] ${partner} countered your offer of ${offerDesc} for ${requestDesc}: they'd want ${counter.receivingNames.join(', ')} for ${counter.givingNames.join(', ')}.`);
      recordTradeOutcome('countered', userTeam, draft.offer, partner, draft.request, counter.receivingNames, counter.givingNames);
      STATE._tradeResultMessage = { type: 'countered', text: `${partner} countered: they want ${counter.receivingNames.join(', ')} from you for ${counter.givingNames.join(', ')}.` };
      STATE._tradeDraft = { withTeam: partner, offer: counter.receivingNames, request: counter.givingNames };
      saveState(); render();
      return;
    }
    STATE.log.unshift(`[Trade] ${partner} rejected your offer of ${offerDesc} for ${requestDesc} -- not enough value coming back.`);
    recordTradeOutcome('declined', userTeam, draft.offer, partner, draft.request);
    STATE._tradeResultMessage = { type: 'declined', text: `${partner} declined your trade.` };
  } else {
    STATE.log.unshift(`[Trade] ${partner} rejected your offer of ${offerDesc} for ${requestDesc} -- not enough value coming back.`);
    recordTradeOutcome('declined', userTeam, draft.offer, partner, draft.request);
    STATE._tradeResultMessage = { type: 'declined', text: `${partner} declined your trade.` };

window.respondTradeOffer = function(id, action) {
  const offer = STATE.pendingTradeOffers.find(o => o.id === id);
  if (!offer) return;
  STATE.pendingTradeOffers = STATE.pendingTradeOffers.filter(o => o.id !== id);
  if (action === 'accept') {
    // Belt-and-suspenders check: executeTrade() already prunes any pending offer touched by a
    // trade the moment it happens, so this should never actually trigger in practice -- but an
    // old save from before that fix existed could still be carrying a stale offer, so re-validate
    // against the live roster right before moving anyone rather than trusting the queued offer.
    const fromRoster = [...STATE.teams[offer.fromTeam].starters, ...STATE.teams[offer.fromTeam].bench];
    const userRoster = [...STATE.teams[STATE.userTeam].starters, ...STATE.teams[STATE.userTeam].bench];
    const stillValid = offer.theyGive.every(n => fromRoster.includes(n)) && offer.theyGet.every(n => userRoster.includes(n));
    if (!stillValid) {
      STATE.log.unshift(`[Trade] ${offer.fromTeam}'s offer is no longer valid -- one of the players involved has since moved teams.`);
      STATE._tradeResultMessage = { type: 'declined', text: `That offer is no longer valid -- one of the players involved has since moved teams.` };
      saveState(); render();
      return;
    }
    executeTrade(offer.fromTeam, offer.theyGive, STATE.userTeam, offer.theyGet);
    STATE.log.unshift(`[Trade] You accepted ${offer.fromTeam}'s offer: ${offer.theyGive.join(', ')} for ${offer.theyGet.join(', ')}.`);
    STATE._tradeResultMessage = { type: 'accepted', text: `You accepted the trade with ${offer.fromTeam}!` };
  } else if (action === 'decline') {
    STATE.log.unshift(`[Trade] You declined ${offer.fromTeam}'s offer.`);
    recordTradeOutcome('declined', offer.fromTeam, offer.theyGive, STATE.userTeam, offer.theyGet);
    STATE._tradeResultMessage = { type: 'declined', text: `You declined ${offer.fromTeam}'s trade.` };
  } else if (action === 'counter') {
    // Drop the incoming offer and pre-load the propose-a-trade builder with the reverse of what
    // they offered, so the user can hand-adjust and send their own counter rather than the app
    // auto-generating one on their behalf. Nothing's resolved yet, so no history entry here --
    // the eventual proposeTrade() call logs its own outcome.
    STATE._tradeDraft = { withTeam: offer.fromTeam, offer: offer.theyGet.slice(), request: offer.theyGive.slice() };
    STATE.log.unshift(`[Trade] Build your counter to ${offer.fromTeam} below.`);

/* ===================== UNIVERSAL STORAGE SHIM =====================
   Uses Tauri's fs plugin when running as the desktop app (window.__TAURI__ present), otherwise
   falls back to localStorage -- so this exact same file runs unmodified as a plain website.
   Every persistence function below goes through this instead of touching window.__TAURI__ or
   localStorage directly. Keys are just the same path-like strings already used for file paths
   ("saves/gm_franchise_v1_index.json" etc.) -- localStorage doesn't care that they contain
   slashes, so no separate key scheme was needed. */

  if (hasTauriFs()) { const { fs } = window.__TAURI__; return await fs.exists(key, { baseDir: fs.BaseDirectory.AppData }); }
  return localStorage.getItem(key) !== null;
}
async function storageRead(key) {
  if (hasTauriFs()) { const { fs } = window.__TAURI__; return await fs.readTextFile(key, { baseDir: fs.BaseDirectory.AppData }); }
  return localStorage.getItem(key);
}
async function storageWrite(key, data) {
  if (hasTauriFs()) { const { fs } = window.__TAURI__; await fs.writeTextFile(key, data, { baseDir: fs.BaseDirectory.AppData }); return; }
  localStorage.setItem(key, data);
}
async function storageRemove(key) {
  if (hasTauriFs()) { const { fs } = window.__TAURI__; await fs.remove(key, { baseDir: fs.BaseDirectory.AppData }); return; }
  localStorage.removeItem(key);

async function storageEnsureDir(dir) {
  if (hasTauriFs()) { const { fs } = window.__TAURI__; await fs.mkdir(dir, { baseDir: fs.BaseDirectory.AppData, recursive: true }); }
  // localStorage has no directory concept to create -- no-op there.
}

// Repair pass for a roster-corruption bug (fixed 2026-08-17): confirmLineup() used to only write
// the new batting order onto starters, leaving bench stale. Any lineup edit that changed WHO was
// starting (not just reordering) could duplicate a newly-promoted player onto both starters AND
// bench, while the player they replaced vanished from both arrays entirely -- though their
// STATE.players entry survives (players are never deleted), frozen with whatever data they had
// at the moment they were dropped, since season-rollover only ages/resets players it finds on a
// team's roster. This heals any save already hit by that bug on load: dedupe bench against
// starters, then recover any not-yet-graduated player whose own last-known team no longer lists
// them anywhere. A graduated player (Age>=12) missing from every roster is NOT touched -- that's
// correct retirement, not corruption, and re-adding them would break the age-out rule.
function repairCorruptedRosters() {
  TEAM_NAMES.forEach(teamName => {
    const t = STATE.teams[teamName];
    if (!t) return;
    t.starters = [...new Set(t.starters)];
    t.bench = [...new Set(t.bench)].filter(n => !t.starters.includes(n));
  });
  Object.keys(STATE.players).forEach(name => {
    const p = STATE.players[name];
    const t = p.Team && STATE.teams[p.Team];
    if (!t || p.Age >= 12) return;
    if (!t.starters.includes(name) && !t.bench.includes(name)) t.bench.push(name);
  });
}
async function loadState(id) {
  try {
    const file = franchiseFile(id);
    if (!(await storageExists(file))) return false;
    const raw = await storageRead(file);
    if (raw) {
      STATE = JSON.parse(raw);
      // Restore TEAM_NAMES for THIS franchise (it's mutable now -- see DEFAULT_TEAM_NAMES comment
      // -- so a save from a custom roster needs its own team names back before anything else
      // below reads TEAM_NAMES, including repairCorruptedRosters() a few lines down). Falls back
      // to deriving it from STATE.teams for saves from before this field existed.
      TEAM_NAMES = STATE.teamNames || Object.keys(STATE.teams).sort();
      // Backfill fields for saves created before trades existed.
      if (STATE.tradesEnabled === undefined) STATE.tradesEnabled = false;
      if (!STATE.pendingTradeOffers) STATE.pendingTradeOffers = [];
      if (!STATE.tradeHistory) STATE.tradeHistory = [];
      // Migrate saves created before the round->game rename (2026-08-16): old key names get
      // copied onto the new ones rather than left to silently break every screen that reads them.
      if (!STATE.schedule && STATE.rounds) { STATE.schedule = STATE.rounds; delete STATE.rounds; }
      if (STATE.gamePointer === undefined && STATE.roundPointer !== undefined) { STATE.gamePointer = STATE.roundPointer; delete STATE.roundPointer; }
      if (!STATE.gameDates && STATE.roundDates) { STATE.gameDates = STATE.roundDates; delete STATE.roundDates; }
      if (!STATE.gameResults && STATE.roundResults) { STATE.gameResults = STATE.roundResults; delete STATE.roundResults; }
      // Backfill streak fields for saves created before they existed.
      Object.values(STATE.players).forEach(p => {
        if (p.hitStreak === undefined) p.hitStreak = 0;
        if (p.scorelessInningsStreak === undefined) p.scorelessInningsStreak = 0;
        if (p._gameHadHit === undefined) p._gameHadHit = false;
        if (p._gameHadAB === undefined) p._gameHadAB = false;
      });
      if (!STATE.leagueNews) STATE.leagueNews = [];
      repairCorruptedRosters();

    }
  } catch (e) { /* not available / not found */ }

}
async function saveState() {

  try {
    await ensureSavesDir();
    await storageWrite(franchiseFile(currentSaveId), JSON.stringify(STATE));
    const summary = summarizeState();
    const idx = SAVES_INDEX.findIndex(s => s.id === currentSaveId);
    if (idx >= 0) SAVES_INDEX[idx] = summary; else SAVES_INDEX.push(summary);
    await saveIndex();
  } catch (e) { console.error('save failed', e); }
}

  await saveIndex();

/* ===================== AT-BAT PROBABILITY MODEL ===================== */

  const confBonus = (p.confidenceBat - 50) / 50 * 6;
  return {
    Contact: clamp(p.Contact + bonus + confBonus, 1, 99),
    Power: clamp(p.Power + bonus + confBonus, 1, 99),
    PlateVision: clamp(p.PlateVision + bonus + confBonus, 1, 99),

  const buff = p.practiceBuff;

  const out = {
    Glove: clamp(p.Glove + bonus, 1, 99),
    ArmStrength: clamp(p.ArmStrength + bonus, 1, 99),

  const rested = pool.filter(n => isPitcherRested(n));
  const candidates = rested.length ? rested : pool;

  const byPitOVR = (a,b) => STATE.players[b].PitOVR - STATE.players[a].PitOVR;
  const restedHealthy = roster.filter(n => STATE.players[n].injuredGames === 0 && isPitcherRested(n));
  if (restedHealthy.length) return restedHealthy.sort(byPitOVR)[0];
  const healthy = roster.filter(n => STATE.players[n].injuredGames === 0);

/* ===================== FIELDING EFFECTS (neutral at rating 70 — matches the flat player_ratings_v5

const FIELDING_BASELINE = 70;

}

      : clamp(0.12 + strikes*0.08 - (batter.PlateVision-60)/59*0.08, 0.05, 0.40);

/* ===================== BASERUNNING ===================== */
// bases = [firstRunnerName|null, secondRunnerName|null, thirdRunnerName|null]
function advanceBases(bases, outcome, outs, batterName, opts) {
  opts = opts || {};
  const dpCh = opts.dpChance ?? 0.14;
  const armHold = opts.armHold ?? 0;
  const tagUpCh = opts.tagUpChance ?? 0;
  let runsScored = 0;
  let newOuts = outs;
  let b = bases.slice();
  switch (outcome) {
    case 'BB': {
      if (b[0]) {
        if (b[1]) {
          if (b[2]) runsScored++;
          b[2] = b[1];
        }
        b[1] = b[0];
      }
      b[0] = batterName;
      break;
    }
    case '1B':
    case 'ROE': {
      let b3 = null;
      if (b[2]) runsScored++;
      if (b[1]) {
        if (armHold > 0 && rand() < armHold) { b3 = b[1]; }
        else { runsScored++; }
      }
      b = [batterName, b[0], b3];
      break;
    }
    case '2B': {
      let b3 = null;
      if (b[2]) runsScored++;
      if (b[1]) runsScored++;
      if (b[0]) {
        if (armHold > 0 && rand() < armHold) { b3 = b[0]; }
        else { runsScored++; }
      }
      b = [null, batterName, b3];
      break;
    }
    case '3B': {
      runsScored += b.filter(Boolean).length;
      b = [null, null, batterName];
      break;
    }
    case 'HR': {
      runsScored += b.filter(Boolean).length + 1;
      b = [null, null, null];
      break;
    }
    case 'K': {
      newOuts += 1;
      break;
    }
    case 'OUT': {
      if (b[0] && rand() < dpCh) { newOuts += 2; b[0] = null; } // double play with a runner on first
      else {
        newOuts += 1;
        // Sac-fly tag-up: only the runner on 3rd (the classic, meaningful case) — always tags on
        // a deep fly, unless the outfielder's arm cuts him down at the plate first.
        if (tagUpCh > 0 && b[2] && newOuts < 3) {
          if (rand() < tagUpCh) { newOuts += 1; b[2] = null; } // thrown out at the plate
          else { runsScored++; b[2] = null; } // tags up and scores
        }
      }
      break;
    }
  }
  return { bases: b, runsScored, outs: Math.min(newOuts, 3) };
}

/* ===================== STAT RECORDING (shared by live game + silent sim) ===================== */
function recordPAStats(batterP, pitcherP, outcome, runsScored, outsRecorded) {
  const bs = batterP.stats, ps = pitcherP.stats;
  bs.pa++;

  if (outcome === 'BB') {
    bs.bb++;
  } else if (outcome === 'K') {
    bs.ab++; bs.k++;
    batterP._gameHadAB = true;
  } else if (isHit) {
    bs.ab++; bs.h++;
    if (outcome === '2B') bs['2b']++;
    if (outcome === '3B') bs['3b']++;
    if (outcome === 'HR') bs.hr++;
    batterP._gameHadAB = true;
    batterP._gameHadHit = true;
  } else {
    bs.ab++; // OUT, ROE
    batterP._gameHadAB = true;
  }
  if (outcome !== 'ROE') bs.rbi += runsScored;

  ps.outs += outsRecorded;
  if (outcome === 'K') ps.kP++;
  if (outcome === 'BB') ps.bbP++;
  if (outcome === '1B' || outcome === '2B' || outcome === '3B' || outcome === 'HR') ps.hAllowed++;
  const earnedThisPA = outcome !== 'ROE' ? runsScored : 0;
  if (earnedThisPA > 0) ps.er += earnedThisPA;

  // breaks it the instant it scores; scoreless outs recorded (with no earned run this same PA)
  // extend it. This is more precise than an outing-level check would be, and needs no extra
  // snapshot state.
  if (earnedThisPA > 0) pitcherP.scorelessInningsStreak = 0;
  else if (outsRecorded > 0) pitcherP.scorelessInningsStreak = (pitcherP.scorelessInningsStreak || 0) + outsRecorded / 3;

  const batDelta = { K:-2, BB:1, '1B':2, '2B':3, '3B':4, HR:5, OUT:-1, ROE:1 }[outcome] || 0;
  const pitDelta = { K:2, BB:-2, '1B':-2, '2B':-3, '3B':-4, HR:-5, OUT:1, ROE:-1 }[outcome] || 0;

  pitcherP.confidencePitch = clamp(pitcherP.confidencePitch + pitDelta, 1, 99);
}

// player who got a hit extends it; a player who never got an AB that game (hurt, benched) is left
// untouched, matching the real convention that streaks don't "pause" on games not played.

function findCatcher(lineupOrder, pitcherName) {

}

  const catcherP = catcherName ? STATE.players[catcherName] : null;

  let curBases = bases;

  if (curBases.some(Boolean)) {
    const effPitcher = effectivePitcher(pitcherP, pitchesThisOuting);
    const catcherEffForEvents = catcherP ? effectiveFieldingAtSlot(catcherP, 'C') : null;
    const catcherBlocking = catcherEffForEvents ? catcherEffForEvents.Blocking : WILD_PITCH_FALLBACK_BLOCKING;

      wildPitch = true;

  const isOFZone = zone === 'LF' || zone === 'CF' || zone === 'RF';
  const batterSpeed = effectiveFielding(batterP).Speed;

  // defensive play).

/* ===================== SILENT FULL SIM (for AI-vs-AI games — same engine as live games) ===================== */
function simFullGame(home, away) {
  const spHome = bestAvailablePitcher(home);
  const spAway = bestAvailablePitcher(away);
  const order = { [home]: buildBattingOrderWithPitcher(home, spHome), [away]: buildBattingOrderWithPitcher(away, spAway) };
  const batterIdx = { [home]: 0, [away]: 0 };
  const pitcher = { [home]: spHome, [away]: spAway };
  const pitchCount = { [home]: 0, [away]: 0 };
  const score = { [home]: 0, [away]: 0 };
  const subApplied = { [home]: false, [away]: false };
  const fieldPositions = {
    [home]: autoAssignFieldPositions(order[home], spHome),
    [away]: autoAssignFieldPositions(order[away], spAway),
