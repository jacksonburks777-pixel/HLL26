  let inning = 1, half = 'top', outs = 0, bases = [null, null, null];
  const gameDate = currentGameDate();

  const fielding = () => half === 'top' ? home : away;
  const batting = () => half === 'top' ? away : home;
  const swapPitcher = (team, next) => {
    finalizePitcherOuting(pitcher[team], pitchCount[team], gameDate);
    pitcher[team] = next;
    pitchCount[team] = 0;
  };

  let guard = 0;
  while (guard++ < 400) {
    if (inning === 3 && outs === 0) {
      const team = fielding();
      if (!subApplied[team]) {
        const t = STATE.teams[team];
        const bench = t.bench.filter(n => STATE.players[n].injuredGames === 0);
        const ord = order[team];
        const pName = pitcher[team];
        const swapOut = ord.filter(n => n !== pName).sort((a,b)=>STATE.players[a].BatOVR-STATE.players[b].BatOVR).slice(0,3);
        const swapIn = bench.sort((a,b)=>STATE.players[b].BatOVR-STATE.players[a].BatOVR).slice(0,3);
        swapOut.forEach((out,i) => {
          if (swapIn[i]) {
            const idx = ord.indexOf(out);
            order[team][idx] = swapIn[i];
            const slot = fieldPositions[team][out];
            delete fieldPositions[team][out];
            fieldPositions[team][swapIn[i]] = slot;
          }
        });
        subApplied[team] = true;
      }
    }
    const field = fielding();
    if (pitchCount[field] >= maxPitchesForAge(STATE.players[pitcher[field]].Age)) {
      const next = pickForcedReliever(field, pitcher[field]);
      if (next) swapPitcher(field, next);
    }
    const bat = batting();
    const batterName = order[bat][batterIdx[bat] % 9];
    const pitcherName = pitcher[field];
    const catcherName = findCatcher(order[field], pitcherName);
    const outsBefore = outs;
    const rec = resolvePAAndRecord(batterName, pitcherName, catcherName, fieldPositions[field], pitchCount[field], bases, outsBefore);
    pitchCount[field] += rec.pitchesThrown;
    bases = rec.bases; outs = rec.outs;
    score[bat] += rec.runsScored + rec.wpRuns;
    batterIdx[bat]++;
    if (outs >= 3) {
      outs = 0; bases = [null, null, null];
      if (half === 'top') { half = 'bot'; }
      else {
        if (inning >= 6 && score[home] !== score[away]) break;
        inning++; half = 'top';
      }
    }
    if (pitchCount[field] > maxPitchesForAge(STATE.players[pitcher[field]].Age) * 0.65 && rand() < 0.3) {
      const bullpen = [...STATE.teams[field].starters, ...STATE.teams[field].bench]
        .filter(n => n !== pitcher[field] && STATE.players[n].PitOVR >= 40 && STATE.players[n].injuredGames === 0 && isPitcherRested(n));
      if (bullpen.length) swapPitcher(field, bullpen.sort((a,b)=>STATE.players[b].PitOVR-STATE.players[a].PitOVR)[0]);
    }
  }
  finalizePitcherOuting(pitcher[home], pitchCount[home], gameDate);
  finalizePitcherOuting(pitcher[away], pitchCount[away], gameDate);
  settleConfidenceAfterGame(home, away);
  finalizeHitStreaks([...order[home], ...order[away]]);
  return { homeScore: score[home], awayScore: score[away] };
}

/* ===================== CANONICAL RATING FORMULA (player_ratings_v5 methodology) =====================
   OVR is NOT a weighted average of the displayed attributes. It's a composite Z-score (attributes
   weighted, then z-scored against the real roster's own attribute distribution) converted to a
   percentile via the normal CDF, then mapped through a fixed anchor curve. This is the one formula
   used everywhere OVR gets computed from attributes: permanent upgrades, rookie generation, offseason
   development. The imported player_ratings_v5 values themselves are stored as given, never recomputed
   from this formula — this is for everything computed FROM here on. */
const OVR_ANCHOR_POINTS = [
  [0, 50], [10, 55], [25, 62], [40, 70], [55, 77], [70, 84], [85, 92], [95, 97], [99, 99], [100, 99],
];
function ovrFromPercentile(pct) {
  pct = clamp(pct, 0, 100);
  for (let i = 0; i < OVR_ANCHOR_POINTS.length - 1; i++) {
    const [p0, v0] = OVR_ANCHOR_POINTS[i], [p1, v1] = OVR_ANCHOR_POINTS[i+1];
    if (pct <= p1) return Math.round(v0 + (v1 - v0) * (pct - p0) / (p1 - p0));
  }
  return OVR_ANCHOR_POINTS[OVR_ANCHOR_POINTS.length - 1][1];
}
// Standard normal CDF (Abramowitz & Stegun 26.2.17 approximation, |error| < 7.5e-8).
function normalCDF(z) {
  const t = 1 / (1 + 0.2316419 * Math.abs(z));
  const d = 0.3989423 * Math.exp(-z * z / 2);
  let p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
  if (z > 0) p = 1 - p;
  return p;
}
function zToOVR(z) { return ovrFromPercentile(normalCDF(z) * 100); }
function meanStd(values) {
  const n = values.length;
  const mean = values.reduce((a, b) => a + b, 0) / n;
  const variance = values.reduce((a, b) => a + (b - mean) * (b - mean), 0) / n;
  return { mean, std: Math.sqrt(variance) || 1 };
}
// Fixed reference population for z-scoring: the real 120-player roster (player_ratings_v5), computed
// once and cached. Pitching attributes are computed only from genuine pitchers (K6/BB6/H6 not all a
// flat 30, the non-pitcher placeholder) so the artificial floor doesn't skew the real distribution.
let _rosterAttrStatsCache = null;
function rosterAttributeStats() {
  if (_rosterAttrStatsCache) return _rosterAttrStatsCache;
  const isPitcher = p => !(p.K6_rtg === 30 && p.BB6_rtg === 30 && p.H6_rtg === 30);
  const pitchers = ROSTER_DATA.filter(isPitcher);
  _rosterAttrStatsCache = {
    Contact: meanStd(ROSTER_DATA.map(p => p.Contact)),
    Power: meanStd(ROSTER_DATA.map(p => p.Power)),
    PlateVision: meanStd(ROSTER_DATA.map(p => p.PlateVision)),
    Clutch: meanStd(ROSTER_DATA.map(p => p.Clutch)),
    K6_rtg: meanStd(pitchers.map(p => p.K6_rtg)),
    BB6_rtg: meanStd(pitchers.map(p => p.BB6_rtg)),
    H6_rtg: meanStd(pitchers.map(p => p.H6_rtg)),
  };
  return _rosterAttrStatsCache;
}
function zOf(value, attrName) {
  const s = rosterAttributeStats()[attrName];
  return (value - s.mean) / s.std;
}
function computeBatOVR(p) {
  const z = 0.40*zOf(p.Contact,'Contact') + 0.40*zOf(p.Power,'Power') + 0.12*zOf(p.PlateVision,'PlateVision') + 0.08*zOf(p.Clutch,'Clutch');
  return zToOVR(z);
}
function computePitOVR(p) {
  if (p.K6_rtg === 30 && p.BB6_rtg === 30 && p.H6_rtg === 30) return 30; // non-pitcher flat default, not curved
  const z = 0.45*zOf(p.K6_rtg,'K6_rtg') + 0.30*zOf(p.BB6_rtg,'BB6_rtg') + 0.25*zOf(p.H6_rtg,'H6_rtg');
  return zToOVR(z);
}

/* ===================== PRACTICE ===================== */
function recomputeOVRs(p) {
  p.BatOVR = computeBatOVR(p);
  p.PitOVR = computePitOVR(p);
}
// Chance, per team per practice, that one random player permanently improves.
// Flagged for tuning: ~4% per practice -> roughly 45% chance *someone* on a
// given team gets a permanent bump somewhere across a 15-game season.
const PERMANENT_UPGRADE_CHANCE = 0.04;
const HITTING_ATTRS = ['Contact','Power','PlateVision','Clutch'];
const PITCHING_ATTRS = ['K6_rtg','BB6_rtg','H6_rtg'];
const FIELDING_ATTRS = ['Glove','ArmStrength','Accuracy','Speed'];
const CATCHER_FIELDING_ATTRS = ['Blocking','Framing'];
// Offseason development: every returning (non-graduating) player gets a permanent bell-curve
// boost applied to every attribute in their role, stacking with any upgrades already earned via
// in-season/Fall Ball practice. Centered at 9 (most common 7-8), clamped 3-15 at the tails.
function developmentAmount() { return clamp(Math.round(randNormal(7, 2.2)), 2, 12); }
function applyDevelopmentBoost(p) {
  const amt = developmentAmount();
  const isRealPitcher = !(p.K6_rtg === 30 && p.BB6_rtg === 30 && p.H6_rtg === 30);
  let attrs = [...HITTING_ATTRS, ...FIELDING_ATTRS];
  if (isRealPitcher) attrs = [...attrs, ...PITCHING_ATTRS];
  if (p.Positions.includes('C')) attrs = [...attrs, ...CATCHER_FIELDING_ATTRS];
  attrs.forEach(attr => { p[attr] = clamp(p[attr] + amt, 1, 99); });
  recomputeOVRs(p);
  return amt;
}
function maybeGrantPermanentUpgrade(teamName, roster, chance, rangeMax) {
  if (rand() >= chance) return;
  const eligible = roster.filter(n => STATE.players[n].injuredGames === 0);
  if (!eligible.length) return;
  const name = pick(eligible);
  const p = STATE.players[name];
  let attrs = [...HITTING_ATTRS, ...PITCHING_ATTRS, ...FIELDING_ATTRS];
  if (p.Positions.includes('C')) attrs = [...attrs, ...CATCHER_FIELDING_ATTRS];
  const attr = pick(attrs);
  const amt = 1 + Math.floor(rand()*rangeMax);
  p[attr] = clamp(p[attr] + amt, 1, 99);
  recomputeOVRs(p);
  STATE.log.unshift(`[Development] ${name} (${teamName}) permanently improved ${attr} by +${amt}!`);
}
// Fall Ball uses boosted odds/range — flagged in the plan: 20% (vs regular 4%) and +1..+10 (vs +1..+5).
const FALL_BALL_UPGRADE_CHANCE = 0.20;
const FALL_BALL_UPGRADE_RANGE_MAX = 10;
function runPracticeForTeam(teamName, focus, opts) {
  opts = opts || {};
  const upgradeChance = opts.upgradeChance ?? PERMANENT_UPGRADE_CHANCE;
  const upgradeRangeMax = opts.upgradeRangeMax ?? 5;
  const t = STATE.teams[teamName];
  const roster = [...t.starters, ...t.bench];
  roster.forEach(name => {
    const p = STATE.players[name];
    if (p.injuredGames > 0) return;
    p.practiceBuff = { cat: focus, amt: 1, gamesLeft: 1 };
  });
  // small injury chance per practice, one player max
  if (rand() < 0.04) {
    const victim = pick(roster.filter(n => STATE.players[n].injuredGames === 0));
    if (victim) {
      const dur = rand() < 0.8 ? (1 + Math.floor(rand()*2)) : (2 + Math.floor(rand()*3));
      const desc = pick(INJURY_DESCRIPTIONS);
      STATE.players[victim].injuredGames = dur;
      STATE.log.unshift(`[Practice] ${victim} (${teamName}) ${desc} and will miss ${dur} game(s).`);
      // Headline-worthy if it's a long absence (the 2+floor(rand()*3) tail above) OR it happened
      // to a real difference-maker (OVR 80+) even for a short one -- either is real news, a minor
      // 1-2 game tweak to a bench player isn't.
      const victimOVR = Math.max(STATE.players[victim].BatOVR, STATE.players[victim].PitOVR);
      if (dur >= BIG_INJURY_THRESHOLD || victimOVR >= BIG_INJURY_OVR_THRESHOLD) {
        pushLeagueNewsHeadline(`Injury: ${victim} (${teamName}) ${desc} -- out ${dur} game${dur===1?'':'s'}.`);
      }
    }
  }
  maybeGrantPermanentUpgrade(teamName, roster, upgradeChance, upgradeRangeMax);
}

/* ===================== GAME-DAY RESOLUTION (games for teams the user isn't playing) ===================== */
function resolveGameSlate(slate, skipTeam) {
  slate.forEach(([home, away]) => {
    if (home === skipTeam || away === skipTeam) return; // user's game handled separately
    const { homeScore, awayScore } = simFullGame(home, away);
    applyGameResult(home, away, homeScore, awayScore);
  });
}
function applyGameResult(home, away, homeScore, awayScore) {
  const th = STATE.teams[home], ta = STATE.teams[away];
  th.runsFor += homeScore; th.runsAgainst += awayScore;
  ta.runsFor += awayScore; ta.runsAgainst += homeScore;
  if (homeScore > awayScore) { th.record.w++; ta.record.l++; }
  else { ta.record.w++; th.record.l++; }
  STATE.log.unshift(`${away} @ ${home}: ${awayScore}-${homeScore}`);
  if (STATE._todaysResults) STATE._todaysResults.push({ home, away, homeScore, awayScore });
  if (home === STATE.userTeam || away === STATE.userTeam) {
    const userIsHome = home === STATE.userTeam;
    STATE.gameResults.push({
      round: STATE.gamePointer,
      date: STATE.gameDates[STATE.gamePointer],
      opponent: userIsHome ? away : home,
      home: userIsHome,
      userScore: userIsHome ? homeScore : awayScore,
      oppScore: userIsHome ? awayScore : homeScore,
      win: userIsHome ? homeScore > awayScore : awayScore > homeScore,
    });
  }
}

function standingsList() {
  return TEAM_NAMES.slice().sort((a,b) => {
    const A = STATE.teams[a], B = STATE.teams[b];
    const pctA = A.record.w/(A.record.w+A.record.l||1);
    const pctB = B.record.w/(B.record.w+B.record.l||1);
    if (pctB !== pctA) return pctB - pctA;
    return (B.runsFor-B.runsAgainst) - (A.runsFor-A.runsAgainst);
  });
}

/* ===================== LEAGUE NEWS (auto-generated headlines, regular season only) =====================
   Snapshot every player's counting stats + streaks when a game day begins (goToPractice), diff
   them against current values once that whole day's games are all resolved (end of
   finishGameAndAdvance) to get real per-day box-score deltas -- no separate per-game stat store
   needed, everything reads off the season-cumulative fields that already exist. */
const NEWS_STAT_FIELDS = ['pa','ab','h','2b','3b','hr','bb','k','rbi','outs','er','kP','bbP','hAllowed'];
const NEWS_HIT_STREAK_THRESHOLD = 5;
const NEWS_SCORELESS_STREAK_THRESHOLD = 3;
const NEWS_UPSET_STRENGTH_GAP = 10;
const BIG_INJURY_THRESHOLD = 3;
const BIG_INJURY_OVR_THRESHOLD = 80;
const INJURY_DESCRIPTIONS = [
  'tweaked a hamstring', 'rolled an ankle', 'jammed a finger diving for a ball',
  'took a bad hop off the shin', 'strained a shoulder on a throw', 'tweaked a knee rounding a base',
  'came up limping after a swing', 'jammed a wrist sliding into a bag', 'took a foul ball off the foot',
  'pulled a groin chasing a fly ball', 'twisted an ankle backpedaling', 'banged a knee diving back to first',
];
function snapshotLeagueNewsState() {
  const snap = {};
  Object.keys(STATE.players).forEach(name => {
    const p = STATE.players[name];
    const line = {};
    NEWS_STAT_FIELDS.forEach(f => line[f] = p.stats[f]);
    line.hitStreak = p.hitStreak || 0;
    line.scorelessInningsStreak = p.scorelessInningsStreak || 0;
    snap[name] = line;
  });
  return snap;
}
// Simple team-strength proxy for upset detection: average of each starter's better OVR
// (Bat or Pit), the same "two-way ceiling" idea baseTradeValue() already uses.
function teamOverallStrength(teamName) {
  const starters = STATE.teams[teamName].starters;
  if (!starters.length) return 0;
  return starters.reduce((sum,n) => sum + Math.max(STATE.players[n].BatOVR, STATE.players[n].PitOVR), 0) / starters.length;
}
function generateLeagueNewsForDay() {
  const before = STATE._newsSnapshot;
  const results = STATE._todaysResults || [];
  if (!before || !results.length) { STATE._newsSnapshot = null; STATE._todaysResults = []; return; }

  // Best individual performance: reuses the same linear-weights value model as BatRAA/PitRAA
  // (Part 1), just applied to one day's raw counting deltas instead of a season rate.
  let bestPerf = null;
  Object.keys(STATE.players).forEach(name => {
    const b = before[name];
    if (!b) return;
    const p = STATE.players[name], s = p.stats;
    const d = {}; NEWS_STAT_FIELDS.forEach(f => d[f] = s[f] - b[f]);
    if (d.pa > 0) {
      const singles = d.h - d['2b'] - d['3b'] - d.hr;
      const value = 0.7*d.bb + 0.9*singles + 1.25*d['2b'] + 1.6*d['3b'] + 2.0*d.hr;
      if (value > 0 && (!bestPerf || value > bestPerf.value)) bestPerf = { value, type: 'hit', name, team: p.Team, line: d };
    }
    if (d.outs > 0) {
      const value = (d.outs/3) + d.kP*0.3 - d.er*1.2;
      if (value > 0 && (!bestPerf || value > bestPerf.value)) bestPerf = { value, type: 'pit', name, team: p.Team, line: d };
    }
  });

  // Streak news: extension past the notable threshold, or a snap after being past it.
  let streakEvent = null;
  Object.keys(STATE.players).forEach(name => {
    const b = before[name];
    if (!b) return;
    const p = STATE.players[name];
    const outsToday = p.stats.outs - b.outs;
    const consider = (cand) => { if (!streakEvent || cand.sortVal > streakEvent.sortVal) streakEvent = cand; };
    if (p.hitStreak >= NEWS_HIT_STREAK_THRESHOLD && p.hitStreak > b.hitStreak) {
      consider({ kind: 'hitExtend', name, team: p.Team, length: p.hitStreak, sortVal: p.hitStreak });
    } else if (b.hitStreak >= NEWS_HIT_STREAK_THRESHOLD && p.hitStreak === 0) {
      consider({ kind: 'hitSnap', name, team: p.Team, length: b.hitStreak, sortVal: b.hitStreak });
    }
    if (p.scorelessInningsStreak >= NEWS_SCORELESS_STREAK_THRESHOLD && p.scorelessInningsStreak > b.scorelessInningsStreak) {
      consider({ kind: 'scorelessExtend', name, team: p.Team, length: p.scorelessInningsStreak, sortVal: p.scorelessInningsStreak });
    } else if (b.scorelessInningsStreak >= NEWS_SCORELESS_STREAK_THRESHOLD && p.scorelessInningsStreak === 0 && outsToday > 0) {
      consider({ kind: 'scorelessSnap', name, team: p.Team, length: b.scorelessInningsStreak, sortVal: b.scorelessInningsStreak });
    }
  });

  // Upset: a meaningfully weaker team (by roster OVR) beat a meaningfully stronger one.
  let upset = null;
  results.forEach(r => {
    const winner = r.homeScore > r.awayScore ? r.home : r.away;
    const loser = winner === r.home ? r.away : r.home;
    const gap = teamOverallStrength(loser) - teamOverallStrength(winner);
    if (gap >= NEWS_UPSET_STRENGTH_GAP && (!upset || gap > upset.gap)) {
      upset = {
        winner, loser, gap,
        winScore: winner === r.home ? r.homeScore : r.awayScore,
        loseScore: winner === r.home ? r.awayScore : r.homeScore,
      };
    }
  });

  const headlines = [];
  if (bestPerf) {
    const d = bestPerf.line;
    headlines.push(bestPerf.type === 'hit'
      ? `${bestPerf.name} (${bestPerf.team}) went ${d.h}-for-${d.ab}${d.hr > 0 ? `, ${d.hr} HR` : ''}, ${d.rbi} RBI.`
      : `${bestPerf.name} (${bestPerf.team}) dealt on the mound: ${fmtIP(d.outs)} IP, ${d.kP} K, ${d.er} ER.`);
  }
  // Upset takes priority over a streak note when both happen the same day -- it's the rarer,
  // bigger story; either way this caps the day at 2 headlines total.
  if (upset) {
    headlines.push(`Upset! ${upset.winner} knocked off ${upset.loser} ${upset.winScore}-${upset.loseScore}.`);
  } else if (streakEvent) {
    const k = streakEvent.kind;
    if (k === 'hitExtend') headlines.push(`${streakEvent.name} (${streakEvent.team}) extends hit streak to ${streakEvent.length} games.`);
    else if (k === 'hitSnap') headlines.push(`${streakEvent.name} (${streakEvent.team})'s ${streakEvent.length}-game hit streak comes to an end.`);
    else if (k === 'scorelessExtend') headlines.push(`${streakEvent.name} (${streakEvent.team}) extends scoreless streak to ${streakEvent.length.toFixed(1)} IP.`);
    else headlines.push(`${streakEvent.name} (${streakEvent.team})'s ${streakEvent.length.toFixed(1)}-IP scoreless streak ends.`);
  }

  if (headlines.length) {
    STATE.leagueNews.unshift({ date: STATE.gameDates[STATE.gamePointer], game: STATE.gamePointer + 1, headlines });
  }
  STATE._newsSnapshot = null;
  STATE._todaysResults = [];
}
// Standalone headline events (trades, notable injuries) that happen outside the game-day
// snapshot/diff cycle above -- each gets its own entry the moment it happens, rather than
// waiting for the next day's summary, so the feed stays a real chronological activity log.
function pushLeagueNewsHeadline(headline) {
  STATE.leagueNews.unshift({ date: currentGameDate(), game: STATE.gamePointer + 1, headlines: [headline] });
}

function seasonComplete() {
  return STATE.gamePointer >= STATE.schedule.length;
}

/* ===================== PLAYOFFS ===================== */
function startPlayoffs() {
  const seeds = standingsList().slice(0,8);
  const lastRegDate = STATE.gameDates[STATE.gameDates.length - 1];
  STATE.playoffs = {
    seeds,
    round: 0, // 0=quarterfinal(8), 1=semifinal(4), 2=championship(2, best of 3)
    remaining: seeds.slice(),
    champResults: [], // for best-of-3 tracking
    champion: null,
    mvp: null,
    currentDate: addDays(lastRegDate, 4),
    playoffLog: [], // [{ round, label, date, home, away, homeScore, awayScore }]

}
function advancePlayoffDate() {
  STATE.playoffs.currentDate = addDays(STATE.playoffs.currentDate, 3);
  return STATE.playoffs.currentDate;
}
function playoffPairings() {
  const arr = STATE.playoffs.remaining.slice();
  const pairs = [];
  for (let i=0; i<arr.length/2; i++) pairs.push([arr[i], arr[arr.length-1-i]]);
  return pairs; // [highSeed, lowSeed]
}
function playoffRoundLabel(remainingCount) {
  if (remainingCount === 8) return 'Quarterfinals';
  if (remainingCount === 4) return 'Semifinals';
  if (remainingCount === 2) return 'Championship';
  return 'Playoffs';
}
function applyPlayoffGameResult(home, away, homeScore, awayScore, label) {
  const date = STATE.playoffs.currentDate;
  STATE.log.unshift(`[${label}] ${away} @ ${home}: ${awayScore}-${homeScore}`);
  STATE.playoffs.playoffLog.push({ round: STATE.playoffs.round, label, date, home, away, homeScore, awayScore });
}
function resolveAutoPlayoffPairing(high, low, label, isChamp) {
  if (isChamp) {
    const wins = {[high]:0, [low]:0};
    for (let g=0; g<3; g++) {
      if (wins[high]===2 || wins[low]===2) break;
      const homeTeam = g===1 ? low : high; // high seed hosts games 1 & 3
      const awayTeam = g===1 ? high : low;
      advancePlayoffDate();
      const { homeScore, awayScore } = simFullGame(homeTeam, awayTeam);
      const winner = homeScore>awayScore ? homeTeam : awayTeam;
      wins[winner]++;
      applyPlayoffGameResult(homeTeam, awayTeam, homeScore, awayScore, `${label} G${g+1}`);
    }
    return wins[high]===2 ? high : low;
  }
  advancePlayoffDate();
  const { homeScore, awayScore } = simFullGame(high, low); // high seed hosts
  const winner = homeScore>awayScore ? high : low;
  applyPlayoffGameResult(high, low, homeScore, awayScore, label);
  return winner;
}
function currentPlayoffGameLabel() {
  const po = STATE.playoffs;
  return po.userRoundLabel + (po.userRoundLabel==='Championship' ? ` G${po.userGameNumber}` : '');
}
function activeUserPairing() {
  if (STATE.playoffs && STATE.playoffs.userPairing) {
    const [high, low] = STATE.playoffs.userPairing;
    if (STATE.playoffs.userRoundLabel === 'Championship' && STATE.playoffs.userGameNumber === 2) return [low, high];
    return [high, low];

}
function beginPlayoffRound() {

  // in the next round whenever the user's pairing isn't index 0.
  const winners = new Array(pairs.length).fill(null);

function finishPlayoffRoundAdvance(winners) {

/* ===================== LIVE GAME (user's own games) ===================== */
function fieldPositionsFor(teamName, order, sp, pending) {

  const spAway = (!userIsHome && STATE._pendingSP) ? STATE._pendingSP : bestAvailablePitcher(away);
  const pendingPositions = STATE._pendingPositions;
  STATE._pendingSP = null;
  STATE._pendingPositions = null;

  const orderHome = buildBattingOrderWithPitcher(home, spHome);
  const orderAway = buildBattingOrderWithPitcher(away, spAway);

  STATE.liveGame = {
    home, away, userIsHome,
    isPlayoff: !!(STATE.playoffs && STATE.playoffs.userPhase === 'game'),
    inning: 1, half: 'top', outs: 0, bases: [null,null,null],
    score: { [home]:0, [away]:0 },
    order: { [home]: orderHome, [away]: orderAway },
    batterIdx: { [home]:0, [away]:0 },
    originalOrder: { [home]: orderHome.slice(), [away]: orderAway.slice() },
    pitcher: { [home]: spHome, [away]: spAway },
    pitchCount: { [home]:0, [away]:0 },

// If sp isn't already in order, swaps out the weakest bat to make room for them.

  const weakest = order.slice().sort((a,b)=>STATE.players[a].BatOVR-STATE.players[b].BatOVR)[0];

function buildBattingOrderWithPitcher(teamName, sp) {

/* ===================== FIELD POSITIONS ===================== */
const FIELD_SLOTS = ['P','C','1B','2B','3B','SS','LF','CF','RF'];
const INF_SLOTS = ['2B','3B','SS'];
const OF_SLOTS = ['LF','CF','RF'];
function slotEligible(playerPositions, slot) {
  if (slot === 'P') return true;
  if (slot === 'C') return playerPositions.includes('C');
  if (slot === '1B') return playerPositions.includes('1B');
  if (INF_SLOTS.includes(slot)) return playerPositions.includes('INF');
  if (OF_SLOTS.includes(slot)) return playerPositions.includes('OF');
  return false;
}
// 'primary' if the slot matches the player's first-listed position, 'secondary' if it matches
// any other listed position, 'out' if it matches neither (e.g. an OF-primary player stuck at 2B).
function positionFamiliarity(playerPositions, slot) {
  if (slot === 'P') return 'primary';
  if (slotEligible([playerPositions[0]], slot)) return 'primary';
  if (slotEligible(playerPositions.slice(1), slot)) return 'secondary';
  return 'out';
}
// Flat penalty to the fielding attributes that actually matter for a play (Glove/Arm/Accuracy) —
// not Speed, which is physical and unaffected by positional unfamiliarity. Chosen so a
// fully-out-of-position fielder (e.g. OF at 2B) is a real liability, while a secondary-position
// fielder is only mildly worse than being home. Flat, not scaled by rating, since "how bad is it
// to play out of position" is roughly the same question regardless of skill level.
const POSITION_PENALTY = { primary: 0, secondary: -6, out: -15 };
function effectiveFieldingAtSlot(player, slot) {
  const eff = effectiveFielding(player);
  const penalty = POSITION_PENALTY[positionFamiliarity(player.Positions, slot)];
  if (!penalty) return eff;
  return {
    ...eff,
    Glove: clamp(eff.Glove + penalty, 1, 99),
    ArmStrength: clamp(eff.ArmStrength + penalty, 1, 99),
    Accuracy: clamp(eff.Accuracy + penalty, 1, 99),

}
// Greedy fill: P is always the game's starting pitcher; C/1B get their single-eligible
// starters if available; INF/OF slots split among INF/OF-eligible starters; anything left
// over just gets whoever's left, regardless of natural fit (roster composition doesn't
// always divide cleanly 3-and-3, and every slot needs a body). Within each slot's eligible
// pool, a player whose PRIMARY (Positions[0]) listing matches is taken before one who's only
// eligible via a secondary listing -- matching a player to their real primary position first,
// falling back to secondary only to fill a gap, rather than whoever happens to be first in
// the batting-order array.
function autoAssignFieldPositions(order, spName) {
  const assign = {};
  const used = new Set();
  if (order.includes(spName)) { assign[spName] = 'P'; used.add(spName); }
  const remaining = () => order.filter(n => !used.has(n));
  const take = (slot, category) => {
    const pool = remaining();
    const eligible = n => slotEligible(STATE.players[n].Positions, category);
    const cand = pool.find(n => eligible(n) && positionFamiliarity(STATE.players[n].Positions, category) === 'primary')
      || pool.find(eligible);
    if (cand) { assign[cand] = slot; used.add(cand); }
  };
  take('C', 'C');
  take('1B', '1B');
  INF_SLOTS.forEach(slot => take(slot, slot));
  OF_SLOTS.forEach(slot => take(slot, slot));
  FIELD_SLOTS.forEach(slot => {
    if (Object.values(assign).includes(slot)) return;
    const cand = remaining()[0];
    if (cand) { assign[cand] = slot; used.add(cand); }
  });

}
function slotOf(fieldPositions, name) {

}
function nameAtSlot(fieldPositions, slot) {

  const entry = Object.entries(fieldPositions).find(([, s]) => s === slot);
  return entry ? entry[0] : null;
}
function fieldingTeam() {
  const g = STATE.liveGame;
  return g.half === 'top' ? g.home : g.away;
}

  const g = STATE.liveGame;
  return g.half === 'top' ? g.away : g.home;
}
function isUserFielding() { return fieldingTeam() === STATE.userTeam; }
function isUserBatting() { return battingTeam() === STATE.userTeam; }

function autoAISub(teamName) {
  const t = STATE.teams[teamName];
  const g = STATE.liveGame;
  const bench = t.bench.filter(n => STATE.players[n].injuredGames === 0);
  if (bench.length === 0) { g.subApplied[teamName] = true; return; }
  const order = g.order[teamName];
  const pitcherName = g.pitcher[teamName];
  const swapCandidates = order.filter(n=>n!==pitcherName)
    .sort((a,b)=>STATE.players[a].BatOVR-STATE.players[b].BatOVR).slice(0,3);
  const incoming = bench.sort((a,b)=>STATE.players[b].BatOVR-STATE.players[a].BatOVR).slice(0,3);
  swapCandidates.forEach((out, i) => {
    if (!incoming[i]) return;
    const idx = order.indexOf(out);
    g.order[teamName][idx] = incoming[i];
    const slot = g.fieldPositions[teamName][out];
    delete g.fieldPositions[teamName][out];
    g.fieldPositions[teamName][incoming[i]] = slot;
  });
  g.subApplied[teamName] = true;
  g.playLog.unshift(`[${teamName}] made mandatory substitutions.`);
}
function autoAIRevert(teamName) {
  const g = STATE.liveGame;
  g.revertOffered[teamName] = true; // AI just keeps current lineup ~50/50, simplified: no-op keep subs
}

function checkSubTriggers() {
  const g = STATE.liveGame;
  if (g.inning === 3 && g.outs === 0 && ['top','bot'].includes(g.half)) {
    const team = fieldingTeam();
    if (!g.subApplied[team]) {
      if (team === STATE.userTeam) { g.needsSubChoiceFor = team; return true; }
      else { autoAISub(team); }
    }
  }
  if (g.inning === 5 && g.outs === 0) {
    const team = fieldingTeam();
    if (!g.revertOffered[team]) {
      if (team === STATE.userTeam) { g.needsRevertChoiceFor = team; return true; }
      else { autoAIRevert(team); }
    }
  }
  return false;
}

// Formats one buildup pitch (everything except the pitch that ends the PA) for pitch-by-pitch
// reveal mode. The final "in play" / K / BB pitch is described by describePlay() instead, since
// it already carries the real outcome (hit/out/walk/strikeout), not just a count update.
function formatPitchLine(entry) {
  const countStr = `${entry.balls}-${entry.strikes}`;
  switch (entry.result) {
    case 'ball': return `Ball. ${countStr}.`;
    case 'called strike': return `Called strike. ${countStr}.`;
    case 'swinging strike': return `Swinging strike. ${countStr}.`;
    case 'foul ball': return `Foul ball. ${countStr}.`;

function nextPA() {
  const g = STATE.liveGame;
  if (g.finished) return;
  if (g.pendingReveal && g.pendingReveal.length) { window.revealNextPitch(); return; }
  if (checkSubTriggers()) { render(); return; }

  enforcePitchCap(fieldingTeam());
  const bat = battingTeam(), field = fieldingTeam();
  const batterName = g.order[bat][g.batterIdx[bat] % 9];
  const pitcherName = g.pitcher[field];
  const catcherName = findCatcher(g.order[field], pitcherName);
  const outsBefore = g.outs;

  const { outcome, bases, runsScored, outs, pitchesThrown, pitchLog, wildPitch, wpRuns, zone, fielder, battedBallType, pickoffOut, stretched } = resolvePAAndRecord(batterName, pitcherName, catcherName, g.fieldPositions[field], g.pitchCount[field], g.bases, outsBefore);
  const wasDP = outcome === 'OUT' && (outs - outsBefore) === 2;
  const finalLine = `${batterName} ${describePlay(outcome, zone, fielder, wasDP, battedBallType, stretched)}${runsScored?` (+${runsScored} run${runsScored>1?'s':''})`:''}`;

  // Applies the already-computed result to real game state (bases/outs/score/inning) — deferred
  // until the pitch-by-pitch reveal (if any) has finished, so the scoreboard/field diagram never
  // update before the pitch that actually caused it has been shown.
  const applyResult = () => {
    g.pitchCount[field] += pitchesThrown;
    g.bases = bases; g.outs = outs;
    g.score[bat] += runsScored + wpRuns;
    g.batterIdx[bat]++;
    g.lastPlay = { zone, fielder, outcome, battedBallType, pitchLog, batterName };
    if (wildPitch) g.playLog.unshift(`Wild pitch!${wpRuns ? ` (+${wpRuns} run${wpRuns>1?'s':''})` : ''}`);
    if (pickoffOut) g.playLog.unshift(`${pickoffOut} picked off by the catcher!`);
    g.playLog.unshift(finalLine);
    if (rand() < 0.006) {
      const dur = 1 + Math.floor(rand()*2);
      STATE.players[batterName].injuredGames = Math.max(STATE.players[batterName].injuredGames, dur);
      g.injuries.push(batterName);
      g.playLog.unshift(`${batterName} ${pick(INJURY_DESCRIPTIONS)} — day-to-day (${dur} game(s)).`);
    }
    if (g.outs >= 3) {
      g.outs = 0; g.bases = [null,null,null];
      if (g.half === 'top') { g.half = 'bot'; }
      else {
        if (g.inning >= 6 && g.score[g.home] !== g.score[g.away]) { finishGame(); return; }
        g.inning++; g.half = 'top';
      }
    }
    if (!g.finished) autoResolveIfAI();
  };

  if (g.viewMode === 'pitch') {
    const buildupLines = pitchLog.filter(e => e.result !== 'in play').map(formatPitchLine).filter(Boolean);
    g.pendingReveal = buildupLines.map(text => ({ text, apply: null }));
    g.pendingReveal.push({ text: null, apply: applyResult });

  }

  render();
}
// Pops one queued pitch off the reveal queue and shows it; the last entry in the queue also
// applies the PA's real result (see applyResult above) once every buildup pitch has been shown.
window.revealNextPitch = function() {
  const g = STATE.liveGame;
  if (!g || !g.pendingReveal || !g.pendingReveal.length) return;
  const step = g.pendingReveal.shift();
  if (step.text) g.playLog.unshift(step.text);
  if (step.apply) { g.pendingReveal = null; step.apply(); }
  render();
};
// Switching to at-bat mode mid-reveal flushes whatever's left immediately rather than losing it.
window.setViewMode = function(mode) {
  const g = STATE.liveGame;
  if (g && mode === 'atbat' && g.pendingReveal && g.pendingReveal.length) {
    while (g.pendingReveal.length) {
      const step = g.pendingReveal.shift();
      if (step.text) g.playLog.unshift(step.text);
      if (step.apply) step.apply();
    }
    g.pendingReveal = null;
  }
  if (g) g.viewMode = mode;
  render();

// Ends the current half-inning the same way nextPA()'s applyResult does, for actions (steal,
// bunt) that can end it outside the normal PA-resolution path.
function advanceHalfInningIfNeeded(g) {
  if (g.outs >= 3) {
    g.outs = 0; g.bases = [null,null,null];
    if (g.half === 'top') { g.half = 'bot'; }
    else {
      if (g.inning >= 6 && g.score[g.home] !== g.score[g.away]) { finishGame(); return; }
      g.inning++; g.half = 'top';
    }
  }
  if (!g.finished) autoResolveIfAI();

// Manual steal attempt — only offered on your own at-bats; the opposing team's baserunning is
// automatic. fromBase is 1/2/3 for the base the runner currently occupies.
window.attemptSteal = function(fromBase) {
  const g = STATE.liveGame;
  if (!g || g.finished || !isUserBatting()) return;
  const bat = battingTeam(), field = fieldingTeam();
  const idx = fromBase - 1;
  const runnerName = g.bases[idx];
  if (!runnerName) return;
  if (fromBase < 3 && g.bases[idx+1]) return;
  const runnerSpeed = effectiveFielding(STATE.players[runnerName]).Speed;
  const pitcherName = g.pitcher[field];
  const catcherName = findCatcher(g.order[field], pitcherName);
  const catcherEff = catcherName ? effectiveFieldingAtSlot(STATE.players[catcherName], 'C') : null;
  const catcherArm = catcherEff ? (catcherEff.ArmStrength + catcherEff.Accuracy) / 2 : 55;
  const chance = clamp(0.68 + (runnerSpeed - catcherArm)/99*0.28, 0.20, 0.92);
  const success = rand() < chance;
  const toLabel = fromBase === 1 ? 'second' : fromBase === 2 ? 'third' : 'home';
  if (success) {
    if (fromBase === 3) { g.score[bat] += 1; g.bases[idx] = null; }
    else { g.bases[idx+1] = runnerName; g.bases[idx] = null; }
    STATE.players[runnerName].stats.sb++;
    g.playLog.unshift(`${runnerName} steals ${toLabel}!`);
  } else {
    g.bases[idx] = null;
    g.outs++;
    STATE.players[runnerName].stats.cs++;
    g.playLog.unshift(`${runnerName} caught stealing ${toLabel}.`);
  }
  advanceHalfInningIfNeeded(g);
  render();

// Manual bunt attempt — sacrifice intent: existing runners always try to advance one base;

// a sacrifice. No DH-style AB penalty modeling here — kept simple, matches the rest of the stat line.
window.attemptBunt = function() {
  const g = STATE.liveGame;
  if (!g || g.finished || !isUserBatting()) return;
  const bat = battingTeam(), field = fieldingTeam();
  const batterName = g.order[bat][g.batterIdx[bat] % 9];
  const batterP = STATE.players[batterName];
  const speed = effectiveFielding(batterP).Speed;
  const reachChance = clamp(0.28 + (speed-60)/99*0.25, 0.12, 0.60);
  const safe = rand() < reachChance;
  const b = g.bases.slice();
  let runsScored = 0;
  if (b[2]) { runsScored++; b[2] = null; }
  if (b[1]) { b[2] = b[1]; b[1] = null; }
  if (b[0]) { b[1] = b[0]; }
  b[0] = safe ? batterName : null;
  g.bases = b;
  g.score[bat] += runsScored;
  g.batterIdx[bat]++;
  batterP.stats.pa++;
  if (safe) {
    batterP.stats.ab++; batterP.stats.h++;
    batterP.stats.rbi += runsScored;
    g.playLog.unshift(`${batterName} beats out a bunt single!${runsScored?` (+${runsScored} run${runsScored>1?'s':''})`:''}`);
  } else {
    g.outs++;
    if (runsScored) batterP.stats.rbi += runsScored; // sac bunt RBI, no AB charged (matches real scoring)
    g.playLog.unshift(`${batterName} lays down a sacrifice bunt.${runsScored?` (+${runsScored} run${runsScored>1?'s':''})`:''}`);
  }
  g.lastPlay = { zone: null, fielder: null, outcome: safe ? '1B' : 'OUT', battedBallType: 'Ground Ball', pitchLog: [], batterName };
  advanceHalfInningIfNeeded(g);
  render();
};

const FIELD_SPOT_COORDS = {
  CF: [8, 50], LF: [18, 22], RF: [18, 78],
  SS: [42, 35], '2B': [42, 65], '3B': [58, 22], '1B': [58, 78],
  P: [62, 50], C: [85, 50],
};
const BASE_COORDS = { home: [92, 50], first: [68, 68], second: [50, 50], third: [68, 32] };
function lastName(fullName) {
  if (!fullName) return '';
  const parts = fullName.split(' ');
  return parts[parts.length - 1];
}
function fieldDiagram(fieldPositions, bases, lastPlay) {
  const dots = Object.entries(FIELD_SPOT_COORDS).map(([slot, [top, left]]) => {
    const name = nameAtSlot(fieldPositions, slot);
    const isBallHere = lastPlay && lastPlay.zone === slot;
    return `<div class="field-dot${isBallHere ? ' ball-here' : ''}" style="top:${top}%; left:${left}%;" title="${slot}${name ? ': '+name : ''}"></div>
      <div class="field-label" style="top:${top}%; left:${left}%;">${slot}${name ? '<br>'+lastName(name) : ''}</div>`;
  }).join('');
  const [hTop, hLeft] = BASE_COORDS.home;
  const baseDots = [
    { key: 'first', name: bases[0], coords: BASE_COORDS.first },
    { key: 'second', name: bases[1], coords: BASE_COORDS.second },
    { key: 'third', name: bases[2], coords: BASE_COORDS.third },
  ].map(({ name, coords: [top, left] }) => {
    if (!name) return `<div class="runner-dot" style="top:${top}%; left:${left}%; opacity:0.35;"></div>`;
    return `<div class="runner-dot" style="top:${top}%; left:${left}%;"></div>
      <div class="runner-label" style="top:${top-9}%; left:${left}%;">${lastName(name)}</div>`;
  }).join('');
  return `<div class="field-box">
    ${dots}
    <div class="homeplate-dot" style="top:${hTop}%; left:${hLeft}%;"></div>
    ${baseDots}
  </div>`;
}
const BB_TYPE_LABEL = { 'Ground Ball': 'ground ball', 'Line Drive': 'line drive', 'Fly Ball': 'fly ball', 'Pop Fly': 'pop fly' };
const BB_OUT_VERB = { 'Ground Ball': 'grounds out', 'Line Drive': 'lines out', 'Fly Ball': 'flies out', 'Pop Fly': 'pops out' };
function describePlay(outcome, zone, fielder, wasDP, battedBallType, stretched) {
  const by = fielder ? ` (${fielder})` : '';
  const bbLabel = battedBallType ? BB_TYPE_LABEL[battedBallType] : null;
  switch (outcome) {
    case 'K': return 'strikes out';
    case 'BB': return 'walks';
    case 'HR': return zone ? `crushes a home run, deep to ${zone}!` : 'homers!';
    case '3B': return bbLabel ? `hits a ${bbLabel} triple to ${zone}${by}` : `triples to ${zone}${by}`;
    case '2B': return stretched
      ? `hits a ${bbLabel || 'single'} to ${zone}${by} and stretches it into a double!`
      : (bbLabel ? `hits a ${bbLabel} double to ${zone}${by}` : `doubles to ${zone}${by}`);
    case '1B': return bbLabel ? `hits a ${bbLabel} single to ${zone}${by}` : `singles to ${zone}${by}`;
    case 'ROE': return `reaches on an error${fielder ? ` by ${fielder}` : ''} on a ${bbLabel || 'ball'} to ${zone}`;
    case 'OUT': return wasDP ? `grounds into a double play${by}` : `${bbLabel ? BB_OUT_VERB[battedBallType] : 'out'}, ${zone}${by}`;
    default: return outcome;
  }

function userSubChoice(outNames, inNames) {
  const g = STATE.liveGame;
  const team = g.needsSubChoiceFor;
  outNames.forEach((out, i) => {
    const idx = g.order[team].indexOf(out);
    if (idx >= 0 && inNames[i]) {
      g.order[team][idx] = inNames[i];
      const slot = g.fieldPositions[team][out];
      delete g.fieldPositions[team][out];
      g.fieldPositions[team][inNames[i]] = slot;
    }
  });

function buildDraftOrder(finalRegularSeasonStandings) {
  const base = finalRegularSeasonStandings.slice().reverse(); // worst record picks first
  const champ = STATE.playoffs && STATE.playoffs.champion;
  if (!champ) return base;
  const order1 = base.filter(t => t !== champ);
  order1.push(champ); // championship winner picks last
  return order1;
}
function buildDraftBoard(order1, picksNeeded) {
  const maxPicks = Math.max(0, ...TEAM_NAMES.map(t => picksNeeded[t] || 0));
  const picksSoFar = {}; TEAM_NAMES.forEach(t => picksSoFar[t] = 0);
  const board = [];
  for (let r = 0; r < maxPicks; r++) {
    const roundOrder = r % 2 === 0 ? order1 : order1.slice().reverse();
    roundOrder.forEach(team => {
      if (picksSoFar[team] < (picksNeeded[team]||0)) {
        board.push({ round: r, team, prospectId: null, isSkip: false });
        picksSoFar[team]++;
      } else {
        board.push({ round: r, team, prospectId: null, isSkip: true });
      }
    });
  }
  return board;
}
function buildAIKnowledge(fallBallAssignments) {
  const knowledge = {};
  TEAM_NAMES.forEach(teamName => {
    if (teamName === STATE.userTeam) return;
    knowledge[teamName] = {};
    const myFallBall = new Set(fallBallAssignments[teamName] || []);
    STATE.prospectPool.forEach(p => {
      knowledge[teamName][p.id] = myFallBall.has(p.id)
        ? p.scoutedRanges // 100% accurate, same as the user would see
        : computeScoutedRanges({ ...p, scoutedPct: 0 }); // independent noisy 0%-style read
    });
  });
  return knowledge;
}
function aiProspectGrade(teamName, p) {
  const r = STATE.offseason.draft.aiKnowledge[teamName][p.id];
  const estBat = 0.30*midpoint(r.Contact) + 0.30*midpoint(r.Power) + 0.25*midpoint(r.PlateVision) + 0.15*midpoint(r.Clutch);
  const estPit = 0.45*midpoint(r.K6_rtg) + 0.30*midpoint(r.BB6_rtg) + 0.25*midpoint(r.H6_rtg);
  return Math.max(estBat, estPit);
}
function teamPositionCounts(teamName) {
  const t = STATE.teams[teamName];
  const counts = { C:0, '1B':0, INF:0, OF:0 };
  [...t.starters, ...t.bench].forEach(n => {
    const pos = STATE.players[n].Positions[0];
    if (counts[pos] !== undefined) counts[pos]++;
  });
  return counts;
}
function aiPickProspect(teamName, availableProspects) {
  const counts = teamPositionCounts(teamName);
  let best = null, bestScore = -Infinity;
  availableProspects.forEach(p => {
    const grade = aiProspectGrade(teamName, p);
    const primaryPos = p.Positions[0];
    const need = counts[primaryPos] !== undefined ? Math.max(0, 3 - counts[primaryPos]) : 0;
    const score = grade + need * 3;
    if (score > bestScore) { bestScore = score; best = p; }
  });

}

function ccSave() { saveCustomRosterSet(CC_DRAFT); render(); }
window.ccSetTeamIdx = function(i) { CC_TEAM_IDX = i; render(); };
window.ccRenameTeam = function(newName) {
  newName = newName.trim();
  if (!newName) return;
  const oldName = CC_DRAFT.teamNames[CC_TEAM_IDX];
  if (newName === oldName) return;
  if (CC_DRAFT.teamNames.includes(newName)) { alert('Another team already has that name.'); render(); return; }
  CC_DRAFT.teamNames[CC_TEAM_IDX] = newName;
  CC_DRAFT.roster.forEach(p => { if (p.Team === oldName) p.Team = newName; });
  ccSave();
};
const CC_RATING_FIELDS = new Set(['Contact','Power','PlateVision','Clutch','K6_rtg','BB6_rtg','H6_rtg']);
window.ccUpdatePlayerField = function(idx, field, value) {
  const p = CC_DRAFT.roster[idx];
  if (!p) return;
  if (field === 'Age') { p.Age = clamp(parseInt(value,10) || 9, 9, 12); }
  else if (CC_RATING_FIELDS.has(field)) { p[field] = clamp(parseInt(value,10) || 1, 1, 99); recomputeOVRs(p); }
  ccSave();
};
window.ccUpdatePlayerName = function(idx, value) {
  const p = CC_DRAFT.roster[idx];
  if (!p || !value.trim()) return;
  p.Name = value.trim();
  ccSave();
};
// Reassigns a player to a different team from their own row -- no need to switch tabs first.
// Over/under 12 is allowed mid-reshuffle (e.g. moving several players in sequence); the existing
// per-team count badges and the "N/10 teams ready" banner already surface it honestly either way.
window.ccReassignPlayerTeam = function(idx, newTeam) {
  const p = CC_DRAFT.roster[idx];
  if (!p || !CC_DRAFT.teamNames.includes(newTeam)) return;
  p.Team = newTeam;
  ccSave();
};
window.ccTogglePitcher = function(idx, checked) {
  const p = CC_DRAFT.roster[idx];
  if (!p) return;
  if (checked) {
    if (p.K6_rtg === 30 && p.BB6_rtg === 30 && p.H6_rtg === 30) { p.K6_rtg = 60; p.BB6_rtg = 60; p.H6_rtg = 60; }
  } else {
    p.K6_rtg = 30; p.BB6_rtg = 30; p.H6_rtg = 30;
  }
  recomputeOVRs(p);
  ccSave();
};
const CC_POS_OPTIONS = ['C','1B','INF','OF'];
window.ccSetPrimaryPosition = function(idx, pos) {
  const p = CC_DRAFT.roster[idx];
  if (!p) return;
  const secondary = p.Positions[1];
  p.Positions = (secondary && secondary !== pos) ? [pos, secondary] : [pos];
  ccSave();
};
window.ccSetSecondaryPosition = function(idx, pos) {
  const p = CC_DRAFT.roster[idx];
  if (!p) return;
  p.Positions = pos ? [p.Positions[0], pos] : [p.Positions[0]];
  ccSave();
};
window.ccRemovePlayer = function(idx) {
  CC_DRAFT.roster.splice(idx, 1);
  ccSave();
};
window.ccAddPlayer = function() {
  const teamName = CC_DRAFT.teamNames[CC_TEAM_IDX];
  const count = CC_DRAFT.roster.filter(p => p.Team === teamName).length;
  if (count >= CUSTOM_ROSTER_TEAM_SIZE) return;
  const p = {
    Name: 'New Player', Team: teamName, Age: 10,
    Contact: 60, Power: 60, PlateVision: 60, Clutch: 60,
    K6_rtg: 30, BB6_rtg: 30, H6_rtg: 30,

function ccPlayerRow(p) {

    <td>${numInput('Power', p.Power)}</td>

  const draftIsStale = STATE._lineupDraft && (

  );
  if (!STATE._lineupDraft || draftIsStale) {

    STATE._lineupDraft = { order, sp: defaultSP, positions: autoAssignFieldPositions(order, defaultSP) };

            return `
            <div class="prow">

window.setDraftSP = function(name) {
  const draft = STATE._lineupDraft;
  draft.sp = name;
  draft.positions = autoAssignFieldPositions(draft.order, draft.sp);
  render();
};
window.setDraftPosition = function(name, newSlot) {
  const draft = STATE._lineupDraft;
  const oldSlot = draft.positions[name];
  const other = Object.keys(draft.positions).find(n => draft.positions[n] === newSlot);
  if (other && other !== name) draft.positions[other] = oldSlot;
  draft.positions[name] = newSlot;
  render();
};
window.swapOut = function(name) {
  if (STATE._lineupDraft.order.length<=1) return;
  STATE._lineupDraft.order = STATE._lineupDraft.order.filter(n=>n!==name);
  STATE._lineupDraft.positions = autoAssignFieldPositions(STATE._lineupDraft.order, STATE._lineupDraft.sp);
  render();
};
window.swapIn = function(name) {
  if (STATE._lineupDraft.order.length>=9) return;
  STATE._lineupDraft.order.push(name);
  STATE._lineupDraft.positions = autoAssignFieldPositions(STATE._lineupDraft.order, STATE._lineupDraft.sp);
  render();
};
window.confirmLineup = function() {
  const draft = STATE._lineupDraft;
  if (draft.order.length !== 9) { alert('You need exactly 9 in the batting order.'); return; }
  const t = STATE.teams[STATE.userTeam];
  // Bug fix (2026-08-17): this used to only write the new order onto starters, leaving bench
  // untouched -- anyone newly started stayed duplicated on bench, anyone newly benched (removed
  // from the draft order via swapOut) had nowhere to land and just vanished from the roster
  // entirely. Repartitioning the FULL pre-edit roster (starters+bench) into "new starters" /
  // "everyone else" is the correct, self-consistent way to apply the edit.
  const fullRoster = [...t.starters, ...t.bench];
  t.starters = draft.order.slice();
  t.bench = fullRoster.filter(n => !draft.order.includes(n));
  STATE._pendingSP = draft.sp;
  STATE._pendingPositions = { ...draft.positions, [draft.sp]: 'P' };
  STATE._lineupDraft = null;
  if (STATE._lineupIntent === 'setOnly') {
    STATE._lineupIntent = null;
    STATE.screen = 'dashboard';
    saveState(); render();
    return;
  }
  STATE._lineupIntent = null;
  beginUserGameFromLineup();
  render();
};

}

function confidenceBar(label, val) {
  const pct = clamp(val, 0, 99);
  const color = pct >= 65 ? 'var(--amber)' : pct <= 35 ? 'var(--red)' : 'var(--field-line)';
  return `<div style="margin-top:6px">
    <div class="pmeta">${label}: ${Math.round(pct)}/99</div>
    <div style="background:var(--panel-2); border-radius:3px; height:8px; overflow:hidden; margin-top:2px;">
      <div style="width:${pct}%; height:100%; background:${color};"></div>
    </div>
  </div>`;
}
function staminaBar(pitchCount, cap) {
  const pct = clamp(100 - (pitchCount/cap*100), 0, 100);
  const color = pct >= 55 ? 'var(--amber)' : pct <= 25 ? 'var(--red)' : 'var(--field-line)';
  return `<div style="margin-top:6px">
    <div class="pmeta">Stamina: ${pitchCount}/${cap} pitches</div>
    <div style="background:var(--panel-2); border-radius:3px; height:8px; overflow:hidden; margin-top:2px;">
      <div style="width:${pct}%; height:100%; background:${color};"></div>
    </div>
  </div>`;
}

/* ===================== STAT CALCULATIONS ===================== */
function battingAvg(s) { return s.ab ? s.h/s.ab : 0; }
function onBasePct(s) { return (s.ab+s.bb) ? (s.h+s.bb)/(s.ab+s.bb) : 0; }
function slugPct(s) {
  if (!s.ab) return 0;
  const singles = s.h - s['2b'] - s['3b'] - s.hr;
  return (singles + 2*s['2b'] + 3*s['3b'] + 4*s.hr) / s.ab;
}
function opsVal(s) { return onBasePct(s) + slugPct(s); }
function era6(s) { return s.outs ? (s.er * 18 / s.outs) : 0; }
function whip(s) { return s.outs ? ((s.bbP + s.hAllowed) * 3 / s.outs) : 0; }

/* ===================== VALUE STATS: BatRAA / PitRAA (runs above average) =====================
   Confirmed formula (2026-08-16): standard simplified linear weights for batting (BB=0.7,
   1B=0.9, 2B=1.25, 3B=1.6, HR=2.0 runs each) turned into a runs-created-per-PA rate, compared
   against that SEASON's actual league-wide rate and scaled by playing time. Pitching mirrors it
   with runs prevented per inning vs. league average ER/inning. Computed from real accumulated
   stats, never from the static generation ratings -- so this only ever reflects what a player
   actually did. */
function battingRCPerPA(s) {
  if (!s.pa) return 0;
  const singles = s.h - s['2b'] - s['3b'] - s.hr;
  return (0.7*s.bb + 0.9*singles + 1.25*s['2b'] + 1.6*s['3b'] + 2.0*s.hr) / s.pa;
}
function pitchingERPerInning(s) {
  const ip = s.outs / 3;
  return ip > 0 ? s.er / ip : 0;
}
// League-wide averages for a given collection of season stat-lines (one per player who has that
// season's stats) -- PA/IP-weighted, not a simple average of rates, so a handful of small-sample
// players can't skew it as much as the everyday regulars do.
function leagueSeasonAverages(statsList) {
  const hitters = statsList.filter(s => s.pa > 0);
  const pitchers = statsList.filter(s => s.outs > 0);
  const totalPA = hitters.reduce((sum,s) => sum + s.pa, 0);
  const totalRC = hitters.reduce((sum,s) => sum + battingRCPerPA(s) * s.pa, 0);
  const totalIP = pitchers.reduce((sum,s) => sum + s.outs/3, 0);
  const totalER = pitchers.reduce((sum,s) => sum + s.er, 0);
  return {
    avgRCPerPA: totalPA > 0 ? totalRC / totalPA : 0,
    avgERPerInning: totalIP > 0 ? totalER / totalIP : 0,
  };
}
function computeBatRAA(s, avgRCPerPA) { return (battingRCPerPA(s) - avgRCPerPA) * s.pa; }
function computePitRAA(s, avgERPerInning) { return (avgERPerInning - pitchingERPerInning(s)) * (s.outs/3); }
// Current (in-progress) season's league averages, recomputed on demand from every active
// player's live stats -- cheap enough (a few hundred players, simple arithmetic) to not bother
// caching, and it needs to reflect the season as it stands right now, not a stale snapshot.
function currentSeasonLeagueAverages() {
  return leagueSeasonAverages(Object.values(STATE.players).map(p => p.stats));
}
// A past season's league averages, gathered from every player's seasonHistory entry for that
// year (present-roster and long-graduated players alike -- seasonHistory is the permanent record).
function pastSeasonLeagueAverages(year) {
  const lines = Object.values(STATE.players).map(p => p.seasonHistory && p.seasonHistory[year]).filter(Boolean);
  return leagueSeasonAverages(lines);
}
function fmtRate3(x) { return x >= 1 ? x.toFixed(3) : x.toFixed(3).replace(/^0/, ''); }
function fmtIP(outs) { return (Math.floor(outs/3) + '.' + (outs%3)); }
function allPlayersList() {
  return Object.keys(STATE.players).map(n => STATE.players[n]);
}

/* ===================== ALL-TIME RECORDS =====================
   Players are never deleted from STATE.players (graduates included), and every completed season's
   stat line lives forever in p.seasonHistory[year] -- so career/single-season records need no
   separate "retired players" store, they just walk what's already there plus the in-progress season. */
function seasonRecordEntries() {
  const entries = [];
  Object.values(STATE.players).forEach(p => {
    Object.keys(p.seasonHistory || {}).forEach(year => {
      const stats = p.seasonHistory[year];
      entries.push({ name: p.Name, team: stats.Team, year: Number(year), stats });
    });
    if (p.stats.pa > 0 || p.stats.outs > 0) {
      entries.push({ name: p.Name, team: p.Team, year: STATE.seasonNumber, stats: p.stats, inProgress: true });
    }
  });
  const avgCache = {};
  entries.forEach(e => {
    const key = e.inProgress ? 'current' : e.year;
    if (!avgCache[key]) avgCache[key] = e.inProgress ? currentSeasonLeagueAverages() : pastSeasonLeagueAverages(e.year);
    const avgs = avgCache[key];
    e.batRAA = e.stats.pa > 0 ? computeBatRAA(e.stats, avgs.avgRCPerPA) : null;
    e.pitRAA = e.stats.outs > 0 ? computePitRAA(e.stats, avgs.avgERPerInning) : null;
  });
  return entries;
}
// Career BatRAA/PitRAA are the SUM of each season's own RAA (each computed against that season's
// own league average), not recomputed from summed career totals -- summing already-context-adjusted
// per-season value is the correct way to accumulate it; summing raw rates across seasons isn't.
function careerRecordEntries() {
  const byName = {};
  seasonRecordEntries().forEach(e => {
    if (!byName[e.name]) byName[e.name] = {
      name: e.name, team: e.team, seasons: 0,
      totals: { pa:0, ab:0, h:0, '2b':0, '3b':0, hr:0, bb:0, k:0, rbi:0, outs:0, er:0, kP:0, bbP:0, hAllowed:0 },
      batRAA: 0, pitRAA: 0,
    };
    const c = byName[e.name];
    c.team = e.team; // seasonRecordEntries walks each player's seasons in ascending year order, so the last write is their most recent team
    c.seasons++;
    Object.keys(c.totals).forEach(k => c.totals[k] += (e.stats[k] || 0));
    if (e.batRAA !== null) c.batRAA += e.batRAA;
    if (e.pitRAA !== null) c.pitRAA += e.pitRAA;
  });
  return Object.values(byName);
}

function bestSeasonRecord(cat) {
  const entries = seasonRecordEntries().filter(cat.qualifies);
  if (!entries.length) return null;
  return entries.reduce((best,e) => cat.val(e) > cat.val(best) ? e : best);
}
function bestCareerRecord(cat) {
  const entries = careerRecordEntries().filter(cat.qualifies);
  if (!entries.length) return null;
  return entries.reduce((best,c) => cat.val(c) > cat.val(best) ? c : best);
}

/* ===================== MVP (age-12, stats-weighted) ===================== */
function computeMVP() {
  const age12 = allPlayersList().filter(p => p.Age === 12);
  if (!age12.length) { STATE.playoffs.mvp = null; return; }

  const hitters = age12.filter(p => p.stats.pa >= 10);
  const pitchers = age12.filter(p => p.stats.outs >= 9);
  const hitRanked = hitters.slice().sort((a,b) => opsVal(a.stats) - opsVal(b.stats));
  const pitRanked = pitchers.slice().sort((a,b) => (era6(b.stats)*0.6+whip(b.stats)*0.4) - (era6(a.stats)*0.6+whip(a.stats)*0.4));
  const percentile = (ranked, name) => {
    if (ranked.length <= 1) return ranked.some(p=>p.Name===name) ? 0.5 : 0;
    const idx = ranked.findIndex(p => p.Name === name);
    return idx < 0 ? 0 : idx / (ranked.length - 1);
  };

  let best = null;
  age12.forEach(p => {
    const hp = percentile(hitRanked, p.Name);
    const pp = percentile(pitRanked, p.Name);
    const score = Math.max(hp, pp);
    const reason = hp >= pp
      ? `${fmtRate3(opsVal(p.stats))} OPS`
      : `${era6(p.stats).toFixed(2)} ERA/6, ${whip(p.stats).toFixed(2)} WHIP`;
    if (!best || score > best.score) best = { name: p.Name, team: p.Team, score, reason };
  });
  STATE.playoffs.mvp = best ? { name: best.name, team: best.team, reason: best.reason } : null;
}

function fmtRange(r) { return r ? `${r[0]}-${r[1]}` : '?'; }
function prospectSummaryLine(p) {

    + (p.Positions.includes('C') ? ` · Blk ${fmtRange(r.Blocking)} · Frm ${fmtRange(r.Framing)}` : '');
}
const PROSPECT_POS_FILTERS = ['C','1B','INF','OF'];
let scoutingUI = { posFilter: '', ageFilter: '', scoutFilter: '', sort: 'rank', favOnly: false, selectedId: null };
function compositeRange(ranges, weights) {
  let lo = 0, hi = 0;
  weights.forEach(([attr, w]) => { lo += ranges[attr][0]*w; hi += ranges[attr][1]*w; });
  return [Math.round(lo), Math.round(hi)];
}
// Condensed per-card summary: BAT/PIT reuse the real BatOVR/PitOVR weights applied to each
// component's range bounds (not just the midpoint), so the card shows a genuine composite range.
// FLD is a simple average of Glove/ArmStrength/Accuracy ranges — there's no existing "FieldOVR"
// to reuse, this is just for this card.
function prospectHeadline(p) {
  const r = p.scoutedRanges;
  const bat = compositeRange(r, [['Contact',.30],['Power',.30],['PlateVision',.25],['Clutch',.15]]);
  const pit = compositeRange(r, [['K6_rtg',.45],['BB6_rtg',.30],['H6_rtg',.25]]);
  const fld = [
    Math.round((r.Glove[0]+r.ArmStrength[0]+r.Accuracy[0])/3),
    Math.round((r.Glove[1]+r.ArmStrength[1]+r.Accuracy[1])/3),
  ];
  return { bat, pit, fld };
}
function filteredSortedProspects() {
  const ranked = rankedProspects(STATE.prospectPool);
  const rankOf = {};
  ranked.forEach((p,i) => { rankOf[p.id] = i+1; });
  let list = ranked.slice();
  if (scoutingUI.posFilter) list = list.filter(p => p.Positions.includes(scoutingUI.posFilter));
  if (scoutingUI.ageFilter) list = list.filter(p => String(p.Age) === scoutingUI.ageFilter);
  if (scoutingUI.scoutFilter === '0') list = list.filter(p => p.scoutedPct === 0);
  if (scoutingUI.scoutFilter === '100') list = list.filter(p => p.scoutedPct === 100);
  if (scoutingUI.scoutFilter === 'partial') list = list.filter(p => p.scoutedPct > 0 && p.scoutedPct < 100);
  if (scoutingUI.favOnly) list = list.filter(p => STATE.favoriteProspectIds.includes(p.id));
  const sort = scoutingUI.sort;
  if (sort === 'rank') { /* already ranked */ }
  else if (sort === 'Age') list.sort((a,b) => b.Age - a.Age);
  else if (sort === 'scoutedPct') list.sort((a,b) => b.scoutedPct - a.scoutedPct);
  else list.sort((a,b) => midpoint(b.scoutedRanges[sort]) - midpoint(a.scoutedRanges[sort]));
  return { list, rankOf };
}

function renderProspectDrawer(rankOf, mode) {

  const attrLabels = [['Contact','Contact'],['Power','Power'],['PlateVision','Plate Vision'],['Clutch','Clutch'],

    .concat(p.Positions.includes('C') ? [['Blocking','Blocking'],['Framing','Framing']] : []);

  let actionHtml;
  if (mode === 'draft') {
    const draft = STATE.offseason.draft;
    const takenSlot = draft.board.find(b => b.prospectId === p.id);
    const curSlot = draft.currentPick < draft.board.length ? draft.board[draft.currentPick] : null;
    const isMyTurn = curSlot && !curSlot.isSkip && curSlot.team === STATE.userTeam;
    if (takenSlot) {
      actionHtml = `<div class="dassign"><p class="muted" style="margin:0;">Drafted by <b>${takenSlot.team}</b> (Round ${takenSlot.round+1}).</p></div>`;

        <div class="btnrow"><button class="primary" onclick="confirmDraftPick()">Confirm Pick</button><button onclick="cancelDraftPending()">Cancel</button></div>
      </div>`;
    } else if (isMyTurn) {
      actionHtml = `<div class="dassign">
        <div class="section-label">On the clock</div>
        <button class="pslotbtn" onclick="selectDraftPending('${p.id}')">Draft This Player</button>
      </div>`;
    } else {
      actionHtml = `<div class="dassign"><p class="muted" style="margin:0;">${curSlot ? curSlot.team + ' is currently picking.' : 'Draft not active.'}</p></div>`;
    }
  } else {

      if (sid) {

        return `<div class="slotrow"><span class="slabel"><b>Slot ${i+1}</b><span class="occname">${other.Name}</span></span><button class="pslotbtn replace" onclick="assignScoutSlot(${i}, '${p.id}')">Replace</button></div>`;
      }
      return `<div class="slotrow"><span class="slabel"><b>Slot ${i+1}</b><span class="occname">Empty</span></span><button class="pslotbtn" onclick="assignScoutSlot(${i}, '${p.id}')">Assign</button></div>`;
    }).join('');
    actionHtml = `<div class="dassign"><div class="section-label">Assign to a scouting slot</div>${slotRowsHtml}</div>`;
  }

  return `<div class="pbackdrop open" onclick="closeProspectDetail()"></div>
    <div class="pdrawer open">
      <div class="dhead">
        <div>
          <h2>${p.Name}</h2>
          <div class="dmeta">#${rankOf[p.id]} overall · Age ${p.Age} · ${p.Positions.join('/')} · ${p.scoutedPct}% scouted</div>

}

function renderDraft() {
  if (!STATE.offseason) { navTo('dashboard'); return; }
  const draft = STATE.offseason.draft;
  const done = draft.currentPick >= draft.board.length;
  const curSlot = done ? null : draft.board[draft.currentPick];
  const isMyTurn = curSlot && !curSlot.isSkip && curSlot.team === STATE.userTeam;
  const secondsLeft = draft.timerEnd ? Math.max(0, Math.ceil((draft.timerEnd - Date.now())/1000)) : null;

  const teams = draft.order;
  const maxRound = draft.board.length ? Math.max(...draft.board.map(b=>b.round)) + 1 : 0;
  let gridRows = '';
  for (let r = 0; r < maxRound; r++) {
    gridRows += `<tr><td>${r+1}</td>` + teams.map(team => {
      const idx = draft.board.findIndex(b => b.round===r && b.team===team);
      const slot = draft.board[idx];
      if (!slot) return '<td>—</td>';
      if (slot.isSkip) return '<td class="muted">X</td>';
      const label = slot.prospectId ? STATE.prospectPool.find(x=>x.id===slot.prospectId).Name : (idx===draft.currentPick ? '…' : '');
      return `<td${idx===draft.currentPick ? ' class="me"' : ''}>${label}</td>`;
    }).join('') + '</tr>';
  }

  let actionBlock;
  if (done) {
    actionBlock = `<p>Draft complete.</p><button class="primary" onclick="navTo('draftRecap')">View Recap</button>`;
  } else if (isMyTurn) {
    const timeStr = secondsLeft!==null ? `${Math.floor(secondsLeft/60)}:${String(secondsLeft%60).padStart(2,'0')}` : '';
    actionBlock = `<p>You're on the clock! <b id="draftClock">${timeStr}</b> remaining. Click a prospect below to draft.</p>`;
  } else {
    actionBlock = `<p class="muted">${curSlot.team} is drafting…</p>`;
  }

  let poolBlock = '';
  if (!done) {
    const { list, rankOf } = filteredSortedProspects();
    const takenMap = {};
    draft.board.forEach(b => { if (b.prospectId) takenMap[b.prospectId] = b.team; });
    const cardsHtml = list.map(p => prospectCardHtml(p, rankOf, { takenByTeam: takenMap[p.id] || null })).join('');
    poolBlock = `<div class="card">
        <div class="scoutsectionlabel">Prospect Pool</div>
        ${renderScoutToolbar(list)}
        <div class="gridscroll"><div class="pgrid">${cardsHtml || '<p class="muted">No prospects match these filters.</p>'}</div></div>
      </div>
      ${renderProspectDrawer(rankOf, 'draft')}`;
  }

  APP().innerHTML = `${navBar()}
    <div class="wrap">
      <div class="card">
        <h2>Draft</h2>
        ${actionBlock}
      </div>
      <div class="card">
        <h3>Draft Board</h3>
        <div style="overflow-x:auto;">
          <table class="standings">
            <thead><tr><th>Rd</th>${teams.map(t=>`<th>${t}</th>`).join('')}</tr></thead>
            <tbody>${gridRows}</tbody>
          </table>
        </div>
      </div>
      ${poolBlock}
    </div>`;
}

// Builds a { 'YYYY-MM-DD': [event, ...] } map from the season schedule + playoff log so the
// month-grid renderer below can just look up whatever's happening on a given calendar day.
function calendarEvents() {
  const events = {};
  const add = (date, ev) => { (events[date] = events[date] || []).push(ev); };
  STATE.schedule.forEach((pairing, i) => {
    const date = STATE.gameDates[i];
    const practiceDate = addDays(date, -1);
    const mine = pairing.find(([h,a]) => h===STATE.userTeam || a===STATE.userTeam);
    const isHome = mine && mine[0] === STATE.userTeam;
    const oppo = mine ? (isHome ? mine[1] : mine[0]) : null;
    const result = STATE.gameResults.find(r => r.round === i);
    add(practiceDate, { kind: 'practice', label: `Game ${i+1} Practice` });
    add(date, { kind: 'game', round: i, oppo, isHome, result, isCurrent: i === STATE.gamePointer });
  });
  if (STATE.playoffs && STATE.playoffs.playoffLog) {
    STATE.playoffs.playoffLog.forEach(g => {
      add(addDays(g.date, -1), { kind: 'practice', label: `${g.label} Practice` });
      add(g.date, { kind: 'playoffGame', label: g.label, home: g.home, away: g.away, homeScore: g.homeScore, awayScore: g.awayScore });
    });
  }
  if (STATE.offseason) {
    if (STATE.offseason.fallBallDates) {
      STATE.offseason.fallBallDates.forEach((d, i) => add(d, { kind: 'fallball', session: i+1 }));
    }
    if (STATE.offseason.draftDate) {
      add(STATE.offseason.draftDate, { kind: 'draft' });
    }
  }
  return events;
}
function calendarEventHtml(ev) {
  if (ev.kind === 'practice') return `<div class="cal-event cal-practice" title="${ev.label}">${ev.label}</div>`;
  if (ev.kind === 'game') {
    const label = ev.oppo ? `${ev.isHome?'vs':'@'} ${ev.oppo}` : `Game ${ev.round+1}`;
    const cls = ev.result ? (ev.result.win ? ' cal-win' : ' cal-loss') : '';
    const scoreLine = ev.result ? `<br>${ev.result.win?'W':'L'} ${ev.result.userScore}-${ev.result.oppScore}` : '';
    return `<div class="cal-event cal-game${cls}" title="${label}">${label}${scoreLine}</div>`;
  }
  if (ev.kind === 'playoffGame') {
    const label = `${ev.label}: ${ev.away} @ ${ev.home}`;
    return `<div class="cal-event cal-game" title="${label}">${ev.label}<br>${ev.away} ${ev.awayScore}-${ev.homeScore} ${ev.home}</div>`;
  }
  if (ev.kind === 'fallball') return `<div class="cal-event cal-practice" title="Fall Ball Session ${ev.session}">Fall Ball ${ev.session}</div>`;
  if (ev.kind === 'draft') return `<div class="cal-event cal-game" title="Draft Day">Draft Day</div>`;
  return '';
}
function monthKeyOf(dateStr) { return dateStr.slice(0, 7); }
function monthLabelOf(mk) {
  const [y, mo] = mk.split('-').map(Number);
  return new Date(y, mo-1, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
}
function renderMonthGrid(mk, events) {
  const [y, mo] = mk.split('-').map(Number);
  const daysInMonth = new Date(y, mo, 0).getDate();
  const startDow = new Date(y, mo-1, 1).getDay();
  const cells = [];
  for (let i=0; i<startDow; i++) cells.push(null);
  for (let d=1; d<=daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);

  const cellsHtml = cells.map(d => {
    if (d === null) return `<div class="cal-cell cal-empty"></div>`;
    const dateStr = `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayEvents = events[dateStr] || [];
    const isCurrent = dayEvents.some(ev => ev.isCurrent);
    return `<div class="cal-cell${isCurrent?' cal-current':''}">
      <div class="cal-daynum">${d}</div>
      <div class="cal-events">${dayEvents.map(calendarEventHtml).join('')}</div>
    </div>`;
  }).join('');

  return `<div class="cal-month">
    <div class="cal-monthhead">${monthLabelOf(mk)}</div>
    <div class="cal-grid">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}</div>
    <div class="cal-grid">${cellsHtml}</div>
  </div>`;
}
function renderCalendar() {
  const events = calendarEvents();
  const months = [...new Set(Object.keys(events).sort().map(monthKeyOf))];
  const monthsHtml = months.map(mk => renderMonthGrid(mk, events)).join('');

  APP().innerHTML = `${navBar()}
    <div class="wrap">
      <div class="card">
        <h2>Season Calendar</h2>
        <p class="muted">Practice day, then game day, for every game. Current game highlighted.</p>
      </div>
      ${monthsHtml}
    </div>`;
}

const HITTER_SORTS = { OPS: opsVal, AVG: battingAvg, OBP: onBasePct, SLG: slugPct, HR: s=>s.hr, RBI: s=>s.rbi };
const PITCHER_SORTS = { 'ERA/6': s=>-era6(s), WHIP: s=>-whip(s), K: s=>s.kP, IP: s=>s.outs };
function renderStats() {
  if (!STATE._statsTab) STATE._statsTab = 'hitters';
  const validSorts = STATE._statsTab === 'hitters' ? HITTER_SORTS : PITCHER_SORTS;
  if (!STATE._statsSort || !validSorts[STATE._statsSort]) STATE._statsSort = STATE._statsTab === 'hitters' ? 'OPS' : 'ERA/6';
  const tab = STATE._statsTab;
  const sortKey = STATE._statsSort;

  let body;
  if (tab === 'hitters') {
    const rows = allPlayersList()
      .filter(p => p.stats.pa >= 10)
      .sort((a,b) => HITTER_SORTS[sortKey](b.stats) - HITTER_SORTS[sortKey](a.stats))
      .slice(0, 25);
    body = `<table class="standings">
      <thead><tr><th>Player</th><th>Team</th><th>PA</th><th>AVG</th><th>OBP</th><th>SLG</th><th>OPS</th><th>HR</th><th>RBI</th></tr></thead>

    </table>`;
  } else {
    const rows = allPlayersList()
      .filter(p => p.stats.outs >= 9)
      .sort((a,b) => PITCHER_SORTS[sortKey](b.stats) - PITCHER_SORTS[sortKey](a.stats))
      .slice(0, 25);
    body = `<table class="standings">
      <thead><tr><th>Player</th><th>Team</th><th>IP</th><th>ERA/6</th><th>WHIP</th><th>K</th><th>BB</th><th>H</th></tr></thead>
      <tbody>${rows.map(p => `<tr><td><a href="#" onclick="navToPlayer('${p.Name.replace(/'/g,"\\'")}');return false;">${p.Name}</a></td><td>${p.Team}</td><td>${fmtIP(p.stats.outs)}</td><td>${era6(p.stats).toFixed(2)}</td><td>${whip(p.stats).toFixed(2)}</td><td>${p.stats.kP}</td><td>${p.stats.bbP}</td><td>${p.stats.hAllowed}</td></tr>`).join('') || '<tr><td colspan="8" class="muted">No qualifying pitchers yet (min 3 IP).</td></tr>'}</tbody>
    </table>`;
  }
  const sortOpts = Object.keys(tab === 'hitters' ? HITTER_SORTS : PITCHER_SORTS);

  APP().innerHTML = `${navBar()}
    <div class="wrap">
      <div class="card">
        <h2>League Stats</h2>
        <div class="btnrow">
          <button class="${tab==='hitters'?'primary':''}" onclick="setStatsTab('hitters')">Hitters</button>
          <button class="${tab==='pitchers'?'primary':''}" onclick="setStatsTab('pitchers')">Pitchers</button>

          </select>
        </div>
        ${body}
      </div>
    </div>`;
}

window.setStatsSort = function(key) { STATE._statsSort = key; render(); };
window.navToPlayer = function(name, returnScreen) {
  STATE.selectedPlayer = name;
  STATE._playerCardReturn = returnScreen || 'roster';
  STATE.screen = 'playerCard';
  render();
};

// Reconstructs the full bracket (including still-undecided future matchups) purely from po.seeds
// + po.playoffLog — read-only, doesn't touch simulation state, so it can't drift out of sync.
function computeBracketStructure() {
  const po = STATE.playoffs;
  const pairsOf = arr => { const out = []; for (let i=0;i<arr.length/2;i++) out.push([arr[i], arr[arr.length-1-i]]); return out; };
  const findResult = (a, b, label) => {
    if (!a || !b) return { winner: null, scoreLine: null };
    const games = po.playoffLog.filter(g => g.label.startsWith(label) &&
      ((g.home===a && g.away===b) || (g.home===b && g.away===a)));
    if (!games.length) return { winner: null, scoreLine: null };
    if (label === 'Championship') {
      const wins = { [a]: 0, [b]: 0 };
      games.forEach(g => { const w = g.homeScore>g.awayScore ? g.home : g.away; wins[w]++; });
      const winner = wins[a] >= 2 ? a : (wins[b] >= 2 ? b : null);
      return { winner, scoreLine: `${wins[a]}-${wins[b]}` };
    }
    const g = games[0];
    const winner = g.homeScore > g.awayScore ? g.home : g.away;
    return { winner, scoreLine: `${g.awayScore}-${g.homeScore}` };
  };
  const qf = pairsOf(po.seeds).map(([a,b]) => ({ teams: [a,b], ...findResult(a, b, 'Quarterfinals') }));
  const qfW = qf.map(m => m.winner);
  const sf = pairsOf(qfW).map(([a,b]) => ({ teams: [a,b], ...findResult(a, b, 'Semifinals') }));
  const sfW = sf.map(m => m.winner);
  const champ = { teams: [sfW[0]||null, sfW[1]||null], ...findResult(sfW[0], sfW[1], 'Championship') };
  return { qf, sf, champ: [champ] };
}
function bracketMatchupHtml(m, isFinal) {
  const teamLine = (team, isWinner) => team
    ? `<div class="bracket-team${isWinner?' bracket-winner':''}">${team}</div>`
    : `<div class="bracket-team bracket-tbd">TBD</div>`;
  const [a, b] = m.teams;
  return `<div class="bracket-matchup${isFinal?' bracket-final':''}">
    ${teamLine(a, m.winner && m.winner===a)}
    ${teamLine(b, m.winner && m.winner===b)}
    ${m.scoreLine ? `<div class="bracket-score">${m.scoreLine}</div>` : ''}
  </div>`;
}
function renderBracket(bracket) {
  return `<div class="bracket">
    <div class="bracket-round">
      <div class="bracket-roundlabel">Quarterfinals</div>
      ${bracket.qf.map(m => bracketMatchupHtml(m, false)).join('')}
    </div>
    <div class="bracket-round bracket-round-sf">
      <div class="bracket-roundlabel">Semifinals</div>
      ${bracket.sf.map(m => bracketMatchupHtml(m, false)).join('')}
    </div>
    <div class="bracket-round bracket-round-champ">
      <div class="bracket-roundlabel">Championship</div>
      ${bracket.champ.map(m => bracketMatchupHtml(m, true)).join('')}
    </div>
  </div>`;
}
function renderPlayoffs() {
  const po = STATE.playoffs;
  if (!po) {
    APP().innerHTML = `${navBar()}<div class="wrap"><div class="card"><h2>Playoffs</h2><p>Not started yet — finish the regular season first.</p></div></div>`;
    return;
  }
  const roundName = playoffRoundLabel(po.remaining.length) + (po.remaining.length===2 ? ' (Bo3)' : '');
  let actionBlock;
  if (po.champion) {
    actionBlock = `<div class="finalscore">🏆 ${po.champion}</div>`
      + (!STATE.offseason ? `<button class="primary" onclick="beginOffseason()">Begin Offseason</button>` : `<button class="primary" onclick="navTo('${STATE.offseason.stage === 'fallBall' ? 'fallBall' : 'draft'}')">Go to ${STATE.offseason.stage === 'fallBall' ? 'Fall Ball' : 'Draft'}</button>`);
  } else if (po.userPhase) {
    actionBlock = `<p>Your game is up next.</p><button class="primary" onclick="navTo('dashboard')">Go Play It</button>`;
  } else {
    actionBlock = `<p>Remaining: ${po.remaining.join(' vs ')}</p>
      <button class="primary" onclick="advancePlayoffRound()">Sim ${roundName}</button>`;
  }
  const mvpBlock = po.mvp ? `<div class="card">
      <h3>MVP</h3>
      <p><a href="#" onclick="navToPlayer('${po.mvp.name.replace(/'/g,"\\'")}');return false;">${po.mvp.name}</a> (${po.mvp.team}, age 12) — ${po.mvp.reason}</p>
    </div>` : '';
  const bracket = computeBracketStructure();
  APP().innerHTML = `${navBar()}
    <div class="wrap">
      <div class="card">
        <h2>Playoffs — ${po.champion ? 'Champion Crowned!' : roundName}</h2>
        <p>Seeds (by regular season record): ${po.seeds.map((t,i)=>`${i+1}. ${t}`).join(' · ')}</p>
        ${actionBlock}
      </div>
      <div class="card">
        <h3>Bracket</h3>
        <div class="bracket-scroll">${renderBracket(bracket)}</div>
      </div>
      ${mvpBlock}
      <div class="card">
        <h3>Playoff Log</h3>
        <div class="loglist">${STATE.log.filter(l=>l.includes('Playoffs')||l.includes('Quarterfinals')||l.includes('Semifinals')||l.includes('Championship')).slice(0,15).map(l=>`<div class="logline">${l}</div>`).join('') || '<div class="logline muted">No playoff games yet.</div>'}</div>
      </div>
    </div>`;
}

/* ===================== BOOT ===================== */
async function boot() {
  SAVES_INDEX = await loadIndex();
  CUSTOM_ROSTER_INDEX = await loadCustomRosterIndex();
  render();
}
boot();

</script>
